<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart using localStorage</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        .product {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px auto;
            width: 250px;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
        }

        #cart {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Shopping Cart</h1>

    <div class="product">
        <h3>Pen</h3>
        <p>Price: ₹20</p>
        <button onclick="addToCart('Pen', 20)">Add to Cart</button>
    </div>

    <div class="product">
        <h3>Notebook</h3>
        <p>Price: ₹50</p>
        <button onclick="addToCart('Notebook', 50)">Add to Cart</button>
    </div>

    <div class="product">
        <h3>Bag</h3>
        <p>Price: ₹500</p>
        <button onclick="addToCart('Bag', 500)">Add to Cart</button>
    </div>

    <div id="cart"></div>

    <button onclick="clearCart()">Clear Cart</button>

    <script>

        function addToCart(name, price) {

            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            cart.push({
                name: name,
                price: price
            });

            localStorage.setItem("cart", JSON.stringify(cart));

            displayCart();
        }

        function displayCart() {

            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            let output = "<h2>Cart Items</h2>";

            let total = 0;

            cart.forEach(function(item) {
                output += item.name + " - ₹" + item.price + "<br>";
                total += item.price;
            });

            output += "<br><b>Total: ₹" + total + "</b>";

            document.getElementById("cart").innerHTML = output;
        }

        function clearCart() {

            localStorage.removeItem("cart");

            displayCart();
        }

        displayCart();

    </script>

</body>
</html>
