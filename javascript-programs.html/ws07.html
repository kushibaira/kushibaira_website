<!DOCTYPE html>
<html>
<head>
    <title>Array in localStorage</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 60px;
        }

        button {
            padding: 10px 20px;
        }

        #output {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Store Array using JSON</h1>

    <button onclick="storeArray()">Store Array</button>

    <div id="output"></div>

    <script>
        function storeArray() {
            let subjects = ["HTML", "CSS", "JavaScript"];

            localStorage.setItem(
                "subjects",
                JSON.stringify(subjects)
            );

            let data = JSON.parse(
                localStorage.getItem("subjects")
            );

            document.getElementById("output").innerHTML =
                data.join("<br>");
        }
    </script>

</body>
</html>
