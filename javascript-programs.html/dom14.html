<!DOCTYPE html>
<html>
<head>
    <title>Add Rows Dynamically</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        table {
            border-collapse: collapse;
            margin: 25px auto;
            width: 500px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: lightgray;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Add New Rows Dynamically</h1>

    <table id="studentTable">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
        </tr>
    </table>

    <button onclick="addRow()">Add Row</button>

    <script>

        function addRow() {

            let table = document.getElementById("studentTable");

            let row = table.insertRow();

            let cell1 = row.insertCell(0);
            let cell2 = row.insertCell(1);
            let cell3 = row.insertCell(2);

            cell1.textContent = "Kumar";
            cell2.textContent = "20";
            cell3.textContent = "BCA";
        }

    </script>

</body>
</html>
