<!DOCTYPE html>
<html>
<head>
    <title>CRUD Application</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 30px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>CRUD Application using localStorage</h1>

    <input type="text" id="name" placeholder="Enter name">
    <input type="number" id="age" placeholder="Enter age">

    <button onclick="saveRecord()">Save</button>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>
    </table>

    <script>
        let records =
            JSON.parse(localStorage.getItem("records")) || [];

        let editIndex = -1;

        function saveRecord() {
            let name =
                document.getElementById("name").value;

            let age =
                document.getElementById("age").value;

            if (name == "" || age == "") {
                alert("Please enter all fields.");
                return;
            }

            let record = {
                name: name,
                age: age
            };

            if (editIndex == -1) {
                // CREATE
                records.push(record);
            } else {
                // UPDATE
                records[editIndex] = record;
                editIndex = -1;
            }

            localStorage.setItem(
                "records",
                JSON.stringify(records)
            );

            clearForm();
            displayRecords();
        }

        function displayRecords() {
            let table =
                document.getElementById("tableBody");

            table.innerHTML = "";

            records.forEach(function(record, index) {

                table.innerHTML +=
                    "<tr>" +
                    "<td>" + record.name + "</td>" +
                    "<td>" + record.age + "</td>" +
                    "<td>" +
                    "<button onclick='editRecord(" +
                    index +
                    ")'>Edit</button>" +

                    "<button onclick='deleteRecord(" +
                    index +
                    ")'>Delete</button>" +

                    "</td>" +
                    "</tr>";
            });
        }

        function editRecord(index) {
            document.getElementById("name").value =
                records[index].name;

            document.getElementById("age").value =
                records[index].age;

            editIndex = index;
        }

        function deleteRecord(index) {
            // DELETE
            records.splice(index, 1);

            localStorage.setItem(
                "records",
                JSON.stringify(records)
            );

            displayRecords();
        }

        function clearForm() {
            document.getElementById("name").value = "";
            document.getElementById("age").value = "";
        }

        // READ
        displayRecords();
    </script>

</body>
</html>
