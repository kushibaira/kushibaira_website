<!DOCTYPE html>
<html>
<head>
    <title>Online Offline Detection</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        #status {
            font-size: 25px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Internet Connection Status</h1>

    <div id="status"></div>

    <script>
        function checkStatus() {
            if (navigator.onLine) {
                document.getElementById("status").innerHTML =
                    "Browser is Online";
            } else {
                document.getElementById("status").innerHTML =
                    "Browser is Offline";
            }
        }

        checkStatus();
    </script>

</body>
</html>
