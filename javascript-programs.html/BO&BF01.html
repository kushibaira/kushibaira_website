<!DOCTYPE html>
<html>
<head>
    <title>Window Object</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Window Object</h1>

    <button onclick="showInfo()">Show Window Information</button>

    <div id="output"></div>

    <script>
        function showInfo() {
            document.getElementById("output").innerHTML =
                "Window Width: " + window.innerWidth + " pixels<br>" +
                "Window Height: " + window.innerHeight + " pixels";
        }
    </script>

</body>
</html>
