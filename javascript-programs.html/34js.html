<!DOCTYPE html>
<html>
<body>

<h2>Counter</h2>

<h1 id="counter">0</h1>

<button onclick="decrease()">-</button>
<button onclick="increase()">+</button>

<script>

let count = 0;

function increase() {
    count++;
    document.getElementById("counter")
        .textContent = count;
}

function decrease() {
    count--;
    document.getElementById("counter")
        .textContent = count;
}

</script>

</body>
</html>
