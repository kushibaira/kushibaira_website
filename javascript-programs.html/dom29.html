<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Tooltip</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        #box {
            display: inline-block;
            padding: 20px;
            background-color: lightblue;
            cursor: pointer;
            position: relative;
        }

        #tooltip {
            display: none;
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background-color: black;
            color: white;
            padding: 8px;
            border-radius: 5px;
            white-space: nowrap;
        }
    </style>
</head>

<body>

    <h1>Dynamic Tooltip</h1>

    <div id="box"
         onmouseover="showTooltip()"
         onmouseout="hideTooltip()">

        Move mouse here

        <span id="tooltip">This is a tooltip</span>

    </div>

    <script>
        function showTooltip() {
            document.getElementById("tooltip").style.display = "block";
        }

        function hideTooltip() {
            document.getElementById("tooltip").style.display = "none";
        }
    </script>

</body>
</html>
