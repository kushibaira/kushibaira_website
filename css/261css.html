<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SaaS Billing Management</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb;color:#1e293b}
.wrap{max-width:1000px;margin:auto;padding:30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:white;padding:24px;border-radius:13px;box-shadow:0 4px 15px #0001}
.price{font-size:34px;font-weight:bold}
.table{width:100%;border-collapse:collapse;margin-top:15px}
.table td,.table th{padding:12px;border-bottom:1px solid #eee;text-align:left}
.btn{background:#2563eb;color:white;border:0;padding:11px 18px;border-radius:7px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>Billing Management</h1>
<p>Manage your subscription and payments.</p>
<div class="grid">
<div class="card"><h2>Current Plan</h2><p>Professional</p><div class="price">$49/month</div><p>Next billing date: Oct 15, 2026</p><button class="btn">Change Plan</button></div>
<div class="card"><h2>Payment Method</h2><p>💳 Visa ending in 4242</p><button class="btn">Update Payment</button></div>
</div>
<div class="card" style="margin-top:20px">
<h2>Recent Invoices</h2>
<table class="table">
<tr><th>Date</th><th>Amount</th><th>Status</th></tr>
<tr><td>Sep 15, 2026</td><td>$49</td><td>Paid</td></tr>
<tr><td>Aug 15, 2026</td><td>$49</td><td>Paid</td></tr>
</table>
</div>
</div>
</body>
</html>
