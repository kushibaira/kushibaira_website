<!DOCTYPE html>
<html>
<body>

<img
    id="myImage"
    src="https://via.placeholder.com/300x150?text=Image+1"
    width="300"
>

<br><br>

<button onclick="changeImage()">
    Change Image
</button>

<script>
function changeImage() {

    document.getElementById("myImage").src =
        "https://via.placeholder.com/300x150?text=Image+2";
}
</script>

</body>
</html>
