<!DOCTYPE html>
<html>
<head>
    <title>Change Multiple HTML Elements</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        p {
            font-size: 20px;
            margin: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>DOM Manipulation</h1>

    <h2>Change Multiple HTML Elements</h2>

    <p class="text">First Paragraph</p>
    <p class="text">Second Paragraph</p>
    <p class="text">Third Paragraph</p>

    <button onclick="changeElements()">
        Change All Elements
    </button>

    <script>
        function changeElements() {

            // Select all elements with class "text"
            let elements = document.getElementsByClassName("text");

            // Change all elements
            for (let i = 0; i < elements.length; i++) {
                elements[i].textContent = "Text Changed!";
                elements[i].style.color = "blue";
                elements[i].style.fontSize = "25px";
            }
        }
    </script>

</body>
</html>
