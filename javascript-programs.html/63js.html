<!DOCTYPE html>
<html>
<head>
    <title>Q63 - Vowels and Consonants</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

<h1>Vowels and Consonants</h1>

<input
    type="text"
    id="text"
    placeholder="Enter text"
>

<button onclick="countLetters()">Count</button>

<h2 id="result"></h2>

<script>

    function countLetters() {

        let text =
            document.getElementById("text").value
            .toLowerCase();

        let vowels = 0;
        let consonants = 0;

        for (let char of text) {

            if (/[a-z]/.test(char)) {

                if ("aeiou".includes(char)) {
                    vowels++;
                } else {
                    consonants++;
                }
            }
        }

        document.getElementById("result").innerHTML =
            "Vowels: " + vowels +
            "<br>Consonants: " + consonants;
    }

</script>

</body>
</html>
