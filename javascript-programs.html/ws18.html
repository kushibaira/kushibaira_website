<!DOCTYPE html>
<html>
<head>
    <title>localStorage vs sessionStorage</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
        }

        #output {
            margin-top: 25px;
            line-height: 2;
        }
    </style>
</head>

<body>

    <h1>localStorage vs sessionStorage</h1>

    <button onclick="storeData()">Store Data</button>
    <button onclick="showData()">Show Data</button>

    <div id="output"></div>

    <script>
        function storeData() {
            localStorage.setItem(
                "localData",
                "Saved permanently"
            );

            sessionStorage.setItem(
                "sessionData",
                "Saved for this session"
            );

            document.getElementById("output").innerHTML =
                "Data stored successfully.";
        }

        function showData() {
            document.getElementById("output").innerHTML =
                "localStorage: " +
                localStorage.getItem("localData") +
                "<br>" +
                "sessionStorage: " +
                sessionStorage.getItem("sessionData");
        }
    </script>

</body>
</html>
