<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Select Options</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        select {
            padding: 10px;
            width: 200px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>Dynamic Select Options</h1>

    <select id="course">
        <option>Select a course</option>
    </select>

    <br>

    <button onclick="addOption()">Add Option</button>

    <script>
        let courses = ["BCA", "BSc", "BCom", "BBA", "BA"];
        let index = 0;

        function addOption() {
            if (index < courses.length) {
                let option = document.createElement("option");

                option.textContent = courses[index];
                option.value = courses[index];

                document.getElementById("course").appendChild(option);

                index++;
            } else {
                alert("All options have been added!");
            }
        }
    </script>

</body>
</html>
