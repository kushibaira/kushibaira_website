<!DOCTYPE html>
<html>
<head>
    <title>Focus and Blur Events</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Focus and Blur</h1>

    <input type="text"
           onfocus="focusMessage()"
           onblur="blurMessage()"
           placeholder="Click here">

    <p id="message"></p>

    <script>
        function focusMessage() {
            document.getElementById("message").textContent =
                "Input field is focused.";
        }

        function blurMessage() {
            document.getElementById("message").textContent =
                "Input field lost focus.";
        }
    </script>

</body>
</html>
