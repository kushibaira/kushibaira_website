<!DOCTYPE html>
<html>
<head>
    <title>Progress Bar Component</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background-color: white;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #172554;
            text-align: center;
            margin-bottom: 12px;
        }

        .description {
            color: #64748b;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .progress-section {
            padding: 30px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress-title {
            color: #334155;
            font-weight: bold;
        }

        .progress-value {
            color: #2563eb;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 18px;
            background-color: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            width: 75%;
            height: 100%;
            background-color: #2563eb;
            border-radius: 20px;
            animation: progressAnimation 2s ease-in-out;
        }

        @keyframes progressAnimation {
            from {
                width: 0;
            }

            to {
                width: 75%;
            }
        }

        .progress-info {
            margin-top: 15px;
            color: #64748b;
            font-size: 14px;
        }

        .examples {
            margin-top: 30px;
        }

        .example {
            margin-bottom: 20px;
        }

        .example-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
        }

        .small-progress-bar {
            width: 100%;
            height: 10px;
            background-color: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .small-progress {
            height: 100%;
            border-radius: 20px;
        }

        .progress-one {
            width: 40%;
            background-color: #f59e0b;
        }

        .progress-two {
            width: 60%;
            background-color: #16a34a;
        }

        .progress-three {
            width: 90%;
            background-color: #7c3aed;
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 20px;
            }

            .progress-section {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Progress Bar Component</h1>

        <p class="description">
            A progress bar visually represents the completion
            percentage of a task or process.
        </p>

        <div class="progress-section">

            <div class="progress-header">
                <span class="progress-title">Project Progress</span>
                <span class="progress-value">75%</span>
            </div>

            <div class="progress-bar">
                <div class="progress"></div>
            </div>

            <p class="progress-info">
                The project is 75% completed.
            </p>

            <div class="examples">

                <div class="example">
                    <div class="example-header">
                        <span>Download</span>
                        <span>40%</span>
                    </div>

                    <div class="small-progress-bar">
                        <div class="small-progress progress-one"></div>
                    </div>
                </div>

                <div class="example">
                    <div class="example-header">
                        <span>Installation</span>
                        <span>60%</span>
                    </div>

                    <div class="small-progress-bar">
                        <div class="small-progress progress-two"></div>
                    </div>
                </div>

                <div class="example">
                    <div class="example-header">
                        <span>Final Review</span>
                        <span>90%</span>
                    </div>

                    <div class="small-progress-bar">
                        <div class="small-progress progress-three"></div>
                    </div>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
