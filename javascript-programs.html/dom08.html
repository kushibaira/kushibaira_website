<!DOCTYPE html>
<html>
<head>
    <title>Add and Remove CSS Classes</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 60px;
        }

        #text {
            font-size: 24px;
            margin: 30px;
        }

        .highlight {
            color: white;
            background-color: blue;
            padding: 15px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Add and Remove CSS Classes</h1>

    <p id="text">This is the original paragraph.</p>

    <button onclick="addClass()">Add Class</button>
    <button onclick="removeClass()">Remove Class</button>

    <script>

        function addClass() {
            document.getElementById("text").classList.add("highlight");
        }

        function removeClass() {
            document.getElementById("text").classList.remove("highlight");
        }

    </script>

</body>
</html>
