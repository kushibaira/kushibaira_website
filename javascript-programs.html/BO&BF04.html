<!DOCTYPE html>
<html>
<head>
    <title>setInterval</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        #counter {
            font-size: 40px;
            margin: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>setInterval() Demonstration</h1>

    <div id="counter">0</div>

    <button onclick="startCounter()">Start</button>
    <button onclick="stopCounter()">Stop</button>

    <script>
        let count = 0;
        let timer;

        function startCounter() {
            timer = setInterval(function() {
                count++;
                document.getElementById("counter").innerHTML = count;
            }, 1000);
        }

        function stopCounter() {
            clearInterval(timer);
        }
    </script>

</body>
</html>
