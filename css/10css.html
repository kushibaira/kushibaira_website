<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .box {
            width: 300px;

            /* Content */
            background-color: lightyellow;

            /* Padding: Space inside the border */
            padding: 25px;

            /* Border */
            border: 5px solid green;

            /* Margin: Space outside the border */
            margin: 40px auto;

            text-align: center;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        <h2>Box Model</h2>

        <p>
            This box contains content, padding,
            border and margin.
        </p>
    </div>

</body>
</html>
