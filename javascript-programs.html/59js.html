<!DOCTYPE html>
<html>
<head>
    <title>Q59 - Element Frequency</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 60px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        #result {
            margin-top: 20px;
            line-height: 2;
        }
    </style>
</head>

<body>

<h1>Element Frequency</h1>

<input
    type="text"
    id="array"
    placeholder="apple,banana,apple,orange"
>

<button onclick="findFrequency()">Find</button>

<div id="result"></div>

<script>

    function findFrequency() {

        let arr =
            document.getElementById("array").value
            .split(",")
            .map(item => item.trim());

        let frequency = {};

        arr.forEach(function(item) {

            if (frequency[item]) {
                frequency[item]++;
            } else {
                frequency[item] = 1;
            }

        });

        let output = "";

        for (let item in frequency) {

            output +=
                item + " : " + frequency[item] + "<br>";
        }

        document.getElementById("result").innerHTML =
            output;
    }

</script>

</body>
</html>
