<!DOCTYPE html>
<html>
<head>
    <title>Countdown Timer</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        #timer {
            font-size: 50px;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>
<body>

    <h1>Countdown Timer</h1>

    <div id="timer">10</div>

    <button onclick="startCountdown()">Start</button>

    <script>
        let count = 10;
        let timer;

        function startCountdown() {
            count = 10;

            clearInterval(timer);

            timer = setInterval(function() {
                document.getElementById("timer").innerHTML = count;

                count--;

                if (count < 0) {
                    clearInterval(timer);
                    document.getElementById("timer").innerHTML =
                        "Time Up!";
                }
            }, 1000);
        }
    </script>

</body>
</html>
