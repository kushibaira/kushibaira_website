<!doctype html>
<title>44. Display API data</title>
<button onclick="loadUsers()">Display users</button>
<ul id="list">
</ul>
<script>async function loadUsers(){const response=await fetch('https://jsonplaceholder.typicode.com/users');
const users=await response.json();
list.innerHTML=users.map(user=>`<li>${user.name}</li>`).join('')}</script>
