<!DOCTYPE html>
<html>
<head>
    <title>Strong Password Validator</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Strong Password Validator</h1>

    <input type="password" id="password" placeholder="Enter password">
    <button onclick="validatePassword()">Validate</button>

    <p id="message"></p>

    <script>
        function validatePassword() {
            let password = document.getElementById("password").value;

            let upper = /[A-Z]/.test(password);
            let lower = /[a-z]/.test(password);
            let number = /[0-9]/.test(password);
            let special = /[!@#$%^&*]/.test(password);

            if (password.length >= 8 && upper && lower && number && special) {
                document.getElementById("message").textContent =
                    "Strong password.";
            } else {
                document.getElementById("message").textContent =
                    "Use 8+ characters with uppercase, lowercase, number and special character.";
            }
        }
    </script>

</body>
</html>
