<!DOCTYPE html>
<html>
<head>
    <title>Key Press Counter</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 10px;
            font-size: 18px;
        }

        #count {
            font-size: 25px;
        }
    </style>
</head>
<body>

    <h1>Keyboard Key Press Counter</h1>

    <input type="text" onkeydown="countKey()"
           placeholder="Press keys">

    <p id="count">Key presses: 0</p>

    <script>
        let count = 0;

        function countKey() {
            count++;
            document.getElementById("count").textContent =
                "Key presses: " + count;
        }
    </script>

</body>
</html>
