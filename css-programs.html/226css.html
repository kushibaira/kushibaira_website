<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive SaaS Footer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            padding: 50px 30px;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
        }

        footer {
            background: #1e293b;
            color: white;
            padding: 45px 30px 20px;
        }

        .footer-container {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }

        .footer-column h3 {
            margin-bottom: 15px;
        }

        .footer-column a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            margin-bottom: 10px;
        }

        .footer-column a:hover {
            color: white;
        }

        .copyright {
            text-align: center;
            border-top: 1px solid #475569;
            margin-top: 30px;
            padding-top: 20px;
            color: #cbd5e1;
        }

        @media (max-width: 700px) {
            .footer-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 450px) {
            .footer-container {
                grid-template-columns: 1fr;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <main>
        <section class="hero">
            <h1>Build Better Products</h1>
            <p>Simple SaaS tools for modern teams.</p>
        </section>
    </main>

    <footer>
        <div class="footer-container">

            <div class="footer-column">
                <h3>SaaSPro</h3>
                <p>Powerful tools for growing businesses.</p>
            </div>

            <div class="footer-column">
                <h3>Product</h3>
                <a href="#">Features</a>
                <a href="#">Pricing</a>
                <a href="#">Integrations</a>
            </div>

            <div class="footer-column">
                <h3>Company</h3>
                <a href="#">About</a>
                <a href="#">Careers</a>
                <a href="#">Contact</a>
            </div>

            <div class="footer-column">
                <h3>Support</h3>
                <a href="#">Help Center</a>
                <a href="#">Documentation</a>
                <a href="#">Community</a>
            </div>

        </div>

        <div class="copyright">
            © 2026 SaaSPro. All rights reserved.
        </div>
    </footer>

</body>
</html>
