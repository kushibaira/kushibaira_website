<!DOCTYPE html>
<html>
<body>

<h2>Countdown Timer</h2>

<h1 id="timer">10</h1>

<button onclick="startTimer()">Start</button>

<script>

let count = 10;

function startTimer() {

    let interval =
        setInterval(function () {

            document.getElementById("timer")
                .textContent = count;

            count--;

            if (count < 0) {

                clearInterval(interval);

                document.getElementById("timer")
                    .textContent = "Time Up!";
            }

        }, 1000);
}

</script>

</body>
</html>
