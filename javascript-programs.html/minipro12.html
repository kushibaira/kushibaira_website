<!DOCTYPE html>
<html>
<head>
    <title>Simple Shopping Cart</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        .product {
            display: inline-block;
            border: 1px solid #ccc;
            padding: 20px;
            margin: 10px;
            width: 150px;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
        }

        li {
            list-style: none;
            margin: 8px;
        }
    </style>
</head>

<body>

    <h1>Simple Shopping Cart</h1>

    <div class="product">
        <h3>Pen</h3>
        <p>₹10</p>
        <button onclick="addToCart('Pen', 10)">Add to Cart</button>
    </div>

    <div class="product">
        <h3>Notebook</h3>
        <p>₹50</p>
        <button onclick="addToCart('Notebook', 50)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Bag</h3>
        <p>₹500</p>
        <button onclick="addToCart('Bag', 500)">
            Add to Cart
        </button>
    </div>

    <h2>Shopping Cart</h2>

    <ul id="cart"></ul>

    <h3 id="total">Total: ₹0</h3>

    <button onclick="clearCart()">Clear Cart</button>

    <script>

        let cart = [];
        let total = 0;

        function addToCart(name, price) {

            cart.push({
                name: name,
                price: price
            });

            total = total + price;

            displayCart();
        }

        function displayCart() {

            let cartList = document.getElementById("cart");

            cartList.innerHTML = "";

            for (let item of cart) {

                let li = document.createElement("li");

                li.innerHTML =
                    item.name + " - ₹" + item.price;

                cartList.appendChild(li);
            }

            document.getElementById("total").innerHTML =
                "Total: ₹" + total;
        }

        function clearCart() {

            cart = [];
            total = 0;

            displayCart();
        }

    </script>

</body>
</html>
