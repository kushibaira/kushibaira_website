<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>404 - Page Not Found</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f8fafc;color:#1e293b;min-height:100vh;display:grid;place-items:center;text-align:center}
.box{padding:40px}
.error{font-size:120px;font-weight:bold;color:#2563eb;margin:0}
.btn{display:inline-block;background:#2563eb;color:white;text-decoration:none;padding:12px 22px;border-radius:8px;margin-top:20px}
</style>
</head>
<body>
<div class="box">
<div class="error">404</div>
<h1>Page Not Found</h1>
<p>The page you're looking for doesn't exist or has been moved.</p>
<a class="btn" href="#">Go to Dashboard</a>
</div>
</body>
</html>
