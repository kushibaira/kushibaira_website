<!DOCTYPE html>
<html>
<head>
    <title>Q40 - Classes and Objects</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #eee;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Classes and Objects</h1>

    <button onclick="displayStudent()">Display Student</button>

    <div id="result"></div>

</div>

<script>

    class Student {

        constructor(name, age, course) {
            this.name = name;
            this.age = age;
            this.course = course;
        }

        display() {
            return `
                Name: ${this.name}<br>
                Age: ${this.age}<br>
                Course: ${this.course}
            `;
        }
    }

    function displayStudent() {

        let student = new Student(
            "Rahul",
            20,
            "JavaScript"
        );

        document.getElementById("result").innerHTML =
            student.display();
    }

</script>

</body>
</html>
