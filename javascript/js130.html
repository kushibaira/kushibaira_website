<!doctype html>
<title>130. Add and remove CSS classes</title>
<style>.highlight { color: white; background: teal; padding: 12px; }</style>
<p id="message">Class example</p>
<button id="add">Add class</button>
<button id="remove">Remove class</button>
<script>
	add.onclick = () => message.classList.add("highlight");
	remove.onclick = () => message.classList.remove("highlight");
</script>
