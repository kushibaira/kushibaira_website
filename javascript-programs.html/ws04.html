<!DOCTYPE html>
<html>
<head>
    <title>Delete localStorage Item</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 60px;
        }

        button {
            padding: 10px 20px;
        }

        #output {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Delete localStorage Item</h1>

    <button onclick="deleteItem()">Delete Username</button>

    <div id="output"></div>

    <script>
        localStorage.setItem("username", "John");

        function deleteItem() {
            localStorage.removeItem("username");

            document.getElementById("output").innerHTML =
                "Username deleted from localStorage.";
        }
    </script>

</body>
</html>
