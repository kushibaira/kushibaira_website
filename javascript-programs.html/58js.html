<!DOCTYPE html>
<html>
<head>
    <title>Q58 - Merge Arrays</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

<h1>Merge Two Arrays</h1>

<input
    type="text"
    id="array1"
    placeholder="1,2,3"
>

<br>

<input
    type="text"
    id="array2"
    placeholder="4,5,6"
>

<br>

<button onclick="mergeArrays()">Merge</button>

<h2 id="result"></h2>

<script>

    function mergeArrays() {

        let array1 =
            document.getElementById("array1").value
            .split(",")
            .map(item => item.trim());

        let array2 =
            document.getElementById("array2").value
            .split(",")
            .map(item => item.trim());

        let merged =
            [...array1, ...array2];

        document.getElementById("result").innerHTML =
            "Merged Array: " + merged.join(", ");
    }

</script>

</body>
</html>
