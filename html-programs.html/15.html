<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Components</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="#">
                My Website
            </a>

        </div>
    </nav>

    <!-- Main Container -->

    <div class="container mt-4">

        <h1 class="text-center">
            Bootstrap Components
        </h1>

        <!-- Alert -->

        <div class="alert alert-success">
            Welcome to my website!
        </div>

        <!-- Cards -->

        <div class="row">

            <div class="col-md-4">

                <div class="card">

                    <div class="card-body">

                        <h5 class="card-title">
                            HTML
                        </h5>

                        <p class="card-text">
                            Learn HTML basics.
                        </p>

                        <button class="btn btn-primary">
                            Learn More
                        </button>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card">

                    <div class="card-body">

                        <h5 class="card-title">
                            CSS
                        </h5>

                        <p class="card-text">
                            Learn CSS styling.
                        </p>

                        <button class="btn btn-success">
                            Learn More
                        </button>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card">

                    <div class="card-body">

                        <h5 class="card-title">
                            JavaScript
                        </h5>

                        <p class="card-text">
                            Learn JavaScript.
                        </p>

                        <button class="btn btn-warning">
                            Learn More
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
