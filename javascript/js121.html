<!doctype html>
<title>121. Currency converter</title>
<input id="amount" type="number" value="1"><select id="from"><option>USD</option><option>EUR</option></select><select id="to"><option>EUR</option><option>USD</option></select><button id="convert">Convert</button><p id="result"></p>
<script>
	convert.onclick = async () => { try { const response = await fetch(`https://api.frankfurter.app/latest?amount=${amount.value}&from=${from.value}&to=${to.value}`); const data = await response.json(); result.textContent = `${data.rates[to.value]} ${to.value}`; } catch { result.textContent = "Currency request failed."; } };
</script>
