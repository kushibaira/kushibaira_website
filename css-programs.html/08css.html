<!DOCTYPE html>
<html>
<head>
    <title>CSS Font Properties</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        /* Font Family */
        .family {
            font-family: Georgia, serif;
        }

        /* Font Size */
        .size {
            font-size: 25px;
        }

        /* Font Weight */
        .weight {
            font-weight: bold;
        }

        /* Font Style */
        .style {
            font-style: italic;
        }

        /* Font Variant */
        .variant {
            font-variant: small-caps;
        }

        /* Combined Font Properties */
        .combined {
            font-family: Verdana, sans-serif;
            font-size: 22px;
            font-weight: bold;
            font-style: italic;
            color: green;
        }
    </style>
</head>

<body>

    <h1>CSS Font Properties</h1>

    <p class="family">
        This paragraph uses the Georgia font family.
    </p>

    <p class="size">
        This paragraph has a font size of 25 pixels.
    </p>

    <p class="weight">
        This paragraph uses bold font weight.
    </p>

    <p class="style">
        This paragraph uses italic font style.
    </p>

    <p class="variant">
        This paragraph uses small caps.
    </p>

    <p class="combined">
        This paragraph uses multiple font properties.
    </p>

</body>
</html>
