<!DOCTYPE html>
<html>
<head>
    <title>Question 9 - Palindrome</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Palindrome Number</h1>

    <input type="text" id="number" placeholder="Enter number">
    <button onclick="checkPalindrome()">Check</button>

    <h2 id="result"></h2>

    <script>
        function checkPalindrome() {
            let num = document.getElementById("number").value;
            let reverse = num.split("").reverse().join("");

            if (num === reverse) {
                document.getElementById("result").innerHTML =
                    "Palindrome";
            } else {
                document.getElementById("result").innerHTML =
                    "Not Palindrome";
            }
        }
    </script>

</body>
</html>
