<!DOCTYPE html>
<html>
<head>
    <title>Mouse Down and Up</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Mouse Down and Mouse Up</h1>

    <button onmousedown="mouseDown()" onmouseup="mouseUp()">
        Press Me
    </button>

    <p id="message"></p>

    <script>
        function mouseDown() {
            document.getElementById("message").textContent =
                "Mouse button is pressed.";
        }

        function mouseUp() {
            document.getElementById("message").textContent =
                "Mouse button is released.";
        }
    </script>

</body>
</html>
