<!DOCTYPE html>
<html>
<head>
    <title>Q46 - Login Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            background: #eee;
            padding: 30px;
        }

        .login {
            width: 400px;
            max-width: 100%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .login {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="login">

    <h1>Login</h1>

    <form onsubmit="return login()">

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

</div>

<script>

    function login() {

        let username =
            document.getElementById("username").value.trim();

        let password =
            document.getElementById("password").value;

        let message =
            document.getElementById("message");

        if (username === "") {

            message.innerHTML =
                "Username is required.";

            return false;
        }

        if (password === "") {

            message.innerHTML =
                "Password is required.";

            return false;
        }

        if (password.length < 6) {

            message.innerHTML =
                "Password must contain at least 6 characters.";

            return false;
        }

        message.innerHTML =
            "Login validation successful.";

        return false;
    }

</script>

</body>
</html>
