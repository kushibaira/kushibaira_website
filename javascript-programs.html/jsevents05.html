<!DOCTYPE html>
<html>
<head>
    <title>Onmousemove Event</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        #area {
            width: 400px;
            height: 200px;
            background-color: lightgray;
            margin: auto;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>Onmousemove Event</h1>

    <div id="area" onmousemove="moveMouse(event)">
        Move your mouse inside this area
    </div>

    <p id="position"></p>

    <script>
        function moveMouse(event) {
            document.getElementById("position").textContent =
                "Mouse X: " + event.clientX +
                " | Mouse Y: " + event.clientY;
        }
    </script>

</body>
</html>
