<!DOCTYPE html>
<html>
<head>
    <title>Persistent Shopping Cart</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
        }

        #cart {
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <h1>Persistent Shopping Cart</h1>

    <button onclick="addProduct('Laptop')">
        Add Laptop
    </button>

    <button onclick="addProduct('Mobile')">
        Add Mobile
    </button>

    <button onclick="addProduct('Headphones')">
        Add Headphones
    </button>

    <div id="cart"></div>

    <script>
        let cart =
            JSON.parse(localStorage.getItem("shoppingCart")) || [];

        function addProduct(product) {
            cart.push(product);

            localStorage.setItem(
                "shoppingCart",
                JSON.stringify(cart)
            );

            displayCart();
        }

        function displayCart() {
            document.getElementById("cart").innerHTML =
                "<h3>Cart</h3>" +
                cart.join("<br>");
        }

        displayCart();
    </script>

</body>
</html>
