<!DOCTYPE html>
<html>
<head>
    <title>Q53 - Multiplication Table</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        #result {
            margin: 20px auto;
            width: 300px;
            line-height: 2;
        }
    </style>
</head>

<body>

<h1>Multiplication Table</h1>

<input type="number" id="number" placeholder="Enter number">

<button onclick="generateTable()">Generate</button>

<div id="result"></div>

<script>

    function generateTable() {

        let n =
            Number(document.getElementById("number").value);

        let output = "";

        for (let i = 1; i <= 10; i++) {

            output +=
                `${n} × ${i} = ${n * i}<br>`;
        }

        document.getElementById("result").innerHTML =
            output;
    }

</script>

</body>
</html>
