<!DOCTYPE html>
<html>
<head>
    <title>Recently Viewed Items</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
        }

        #items {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Recently Viewed Items</h1>

    <button onclick="viewItem('Laptop')">Laptop</button>
    <button onclick="viewItem('Phone')">Phone</button>
    <button onclick="viewItem('Headphones')">Headphones</button>

    <div id="items"></div>

    <script>
        let viewed =
            JSON.parse(localStorage.getItem("viewed")) || [];

        function viewItem(item) {
            viewed = viewed.filter(function(value) {
                return value !== item;
            });

            viewed.unshift(item);

            if (viewed.length > 5) {
                viewed.pop();
            }

            localStorage.setItem(
                "viewed",
                JSON.stringify(viewed)
            );

            displayItems();
        }

        function displayItems() {
            document.getElementById("items").innerHTML =
                "<h3>Recently Viewed</h3>" +
                viewed.join("<br>");
        }

        displayItems();
    </script>

</body>
</html>
