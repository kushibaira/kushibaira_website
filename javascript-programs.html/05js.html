<!DOCTYPE html>
<html>
<head>
    <title>Question 5 - Number Check</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Positive, Negative or Zero</h1>

    <input type="number" id="number" placeholder="Enter number">
    <button onclick="checkNumber()">Check</button>

    <h2 id="result"></h2>

    <script>
        function checkNumber() {
            let num = Number(document.getElementById("number").value);

            if (num > 0) {
                document.getElementById("result").innerHTML = "Positive";
            } else if (num < 0) {
                document.getElementById("result").innerHTML = "Negative";
            } else {
                document.getElementById("result").innerHTML = "Zero";
            }
        }
    </script>

</body>
</html>
