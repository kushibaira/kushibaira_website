<!DOCTYPE html>
<html>
<head>
    <title>CSS Cursor Styles</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .box {
            padding: 20px;
            margin: 15px;
            background-color: lightblue;
            border: 2px solid navy;
            text-align: center;
        }

        /* Different Cursor Styles */
        .pointer {
            cursor: pointer;
        }

        .help {
            cursor: help;
        }

        .crosshair {
            cursor: crosshair;
        }

        .text {
            cursor: text;
        }

        .move {
            cursor: move;
        }

        .wait {
            cursor: wait;
        }

        .not-allowed {
            cursor: not-allowed;
        }

        .zoom-in {
            cursor: zoom-in;
        }
    </style>
</head>

<body>

    <h1>CSS Cursor Styles</h1>

    <div class="box pointer">
        Pointer Cursor
    </div>

    <div class="box help">
        Help Cursor
    </div>

    <div class="box crosshair">
        Crosshair Cursor
    </div>

    <div class="box text">
        Text Cursor
    </div>

    <div class="box move">
        Move Cursor
    </div>

    <div class="box wait">
        Wait Cursor
    </div>

    <div class="box not-allowed">
        Not Allowed Cursor
    </div>

    <div class="box zoom-in">
        Zoom In Cursor
    </div>

</body>
</html>
