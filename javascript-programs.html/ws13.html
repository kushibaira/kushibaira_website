<!DOCTYPE html>
<html>
<head>
    <title>Login Preference</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 60px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        #message {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Login Preference System</h1>

    <input type="text" id="username" placeholder="Username">
    <br>

    <label>
        <input type="checkbox" id="remember">
        Remember Me
    </label>

    <br>

    <button onclick="login()">Login</button>

    <div id="message"></div>

    <script>
        window.onload = function() {
            let savedUser =
                localStorage.getItem("savedUsername");

            if (savedUser) {
                document.getElementById("username").value =
                    savedUser;

                document.getElementById("remember").checked =
                    true;
            }
        };

        function login() {
            let username =
                document.getElementById("username").value;

            let remember =
                document.getElementById("remember").checked;

            if (remember) {
                localStorage.setItem(
                    "savedUsername",
                    username
                );
            } else {
                localStorage.removeItem("savedUsername");
            }

            document.getElementById("message").innerHTML =
                "Login preference saved.";
        }
    </script>

</body>
</html>
