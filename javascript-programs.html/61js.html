<!DOCTYPE html>
<html>
<head>
    <title>Q61 - Reverse String</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 80px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

<h1>Reverse String</h1>

<input
    type="text"
    id="text"
    placeholder="Enter a string"
>

<button onclick="reverseString()">Reverse</button>

<h2 id="result"></h2>

<script>

    function reverseString() {

        let text =
            document.getElementById("text").value;

        let reversed =
            text.split("").reverse().join("");

        document.getElementById("result").innerHTML =
            "Reversed: " + reversed;
    }

</script>

</body>
</html>
