<!DOCTYPE html>
<html>
<head>
    <title>Q44 - API Data</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        button {
            display: block;
            margin: auto;
            padding: 10px 20px;
        }

        .card {
            background: white;
            margin: 15px auto;
            padding: 20px;
            max-width: 600px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h1>API Data</h1>

<button onclick="loadData()">Load Posts</button>

<div id="result"></div>

<script>

    function loadData() {

        fetch("https://jsonplaceholder.typicode.com/posts?_limit=5")
            .then(response => response.json())
            .then(data => {

                let output = "";

                data.forEach(post => {

                    output += `
                        <div class="card">
                            <h2>${post.title}</h2>
                            <p>${post.body}</p>
                        </div>
                    `;

                });

                document.getElementById("result").innerHTML =
                    output;

            });
    }

</script>

</body>
</html>
