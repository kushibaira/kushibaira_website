<!DOCTYPE html>
<html>
<head>
    <title>Screen Size</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        #output {
            font-size: 25px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Screen Width and Height</h1>

    <div id="output"></div>

    <script>
        let width = screen.width;
        let height = screen.height;

        document.getElementById("output").innerHTML =
            "Screen Width: " + width + " pixels<br>" +
            "Screen Height: " + height + " pixels";
    </script>

</body>
</html>
