<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Unordered List</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 60px;
        }

        ul {
            width: 250px;
            margin: 20px auto;
            text-align: left;
        }

        li {
            padding: 8px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Dynamic Unordered List</h1>

    <ul id="studentList"></ul>

    <script>

        let students = ["Arun", "Rahul", "Priya", "Kaviya"];

        let list = document.getElementById("studentList");

        students.forEach(function(student) {

            let item = document.createElement("li");

            item.textContent = student;

            list.appendChild(item);
        });

    </script>

</body>
</html>
