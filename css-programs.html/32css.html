<!DOCTYPE html>
<html>
<head>
    <title>CSS 2D Transforms</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-top: 50px;
        }

        .box {
            width: 150px;
            height: 100px;
            background-color: lightblue;
            border: 2px solid blue;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 1s;
        }

        .translate:hover {
            transform: translate(30px, 20px);
        }

        .rotate:hover {
            transform: rotate(45deg);
        }

        .scale:hover {
            transform: scale(1.5);
        }

        .skew:hover {
            transform: skew(20deg, 10deg);
        }

        .combined:hover {
            transform: translate(20px, 10px)
                       rotate(20deg)
                       scale(1.2);
        }
    </style>
</head>

<body>

    <h1>CSS 2D Transforms</h1>

    <div class="container">

        <div class="box translate">
            Translate
        </div>

        <div class="box rotate">
            Rotate
        </div>

        <div class="box scale">
            Scale
        </div>

        <div class="box skew">
            Skew
        </div>

        <div class="box combined">
            Combined
        </div>

    </div>

</body>
</html>
