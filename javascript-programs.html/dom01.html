<!DOCTYPE html>
<html>
<head>
    <title>Change Text Content</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #text {
            font-size: 25px;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1>Change Text Content</h1>

    <p id="text">This is the original text.</p>

    <button onclick="changeText()">Change Text</button>

    <script>

        function changeText() {

            document.getElementById("text").textContent =
                "The text has been changed using JavaScript!";
        }

    </script>

</body>
</html>
