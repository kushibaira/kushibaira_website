<!DOCTYPE html>
<html>
<head>
    <title>College Admission Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .container {
            width: 450px;
            margin: 40px auto;
            padding: 25px;
            background-color: white;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input, select, textarea {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 80px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        #success {
            color: green;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>College Admission Form</h1>

    <form id="admissionForm">

        <label>Student Name:</label>
        <input type="text" id="name">
        <p id="nameError" class="error"></p>

        <label>Email:</label>
        <input type="email" id="email">
        <p id="emailError" class="error"></p>

        <label>Age:</label>
        <input type="number" id="age">
        <p id="ageError" class="error"></p>

        <label>Course:</label>
        <select id="course">
            <option value="">Select Course</option>
            <option value="BCA">BCA</option>
            <option value="BSc">B.Sc</option>
            <option value="BCom">B.Com</option>
            <option value="BA">B.A</option>
        </select>
        <p id="courseError" class="error"></p>

        <label>Address:</label>
        <textarea id="address"></textarea>
        <p id="addressError" class="error"></p>

        <button type="submit">Apply</button>

        <p id="success"></p>

    </form>

</div>

<script>

    let form = document.getElementById("admissionForm");

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let age = document.getElementById("age").value;
        let course = document.getElementById("course").value;
        let address = document.getElementById("address").value.trim();

        let nameError = document.getElementById("nameError");
        let emailError = document.getElementById("emailError");
        let ageError = document.getElementById("ageError");
        let courseError = document.getElementById("courseError");
        let addressError = document.getElementById("addressError");
        let success = document.getElementById("success");

        // Clear previous messages
        nameError.textContent = "";
        emailError.textContent = "";
        ageError.textContent = "";
        courseError.textContent = "";
        addressError.textContent = "";
        success.textContent = "";

        let valid = true;

        // Name validation
        if (name === "") {
            nameError.textContent = "Name is required";
            valid = false;
        }

        // Email validation
        if (email === "") {
            emailError.textContent = "Email is required";
            valid = false;
        }

        // Age validation
        if (age === "") {
            ageError.textContent = "Age is required";
            valid = false;
        } else if (age < 17 || age > 60) {
            ageError.textContent = "Enter a valid age";
            valid = false;
        }

        // Course validation
        if (course === "") {
            courseError.textContent = "Please select a course";
            valid = false;
        }

        // Address validation
        if (address === "") {
            addressError.textContent = "Address is required";
            valid = false;
        }

        // Final result
        if (valid) {
            success.textContent =
                "Admission form submitted successfully!";

            form.reset();
        }

    });

</script>

</body>
</html>
