<!DOCTYPE html>
<html>
<head>
    <title>Hello World</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Hello World</h1>
    <button onclick="showMessage()">Click Me</button>
    <p id="output"></p>

    <script>
        function showMessage() {
            document.getElementById("output").innerHTML = "Hello World!";
        }
    </script>

</body>
</html>
