<!DOCTYPE html>
<html>
<head>
    <title>Keyboard Events</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 12px;
            width: 300px;
            font-size: 18px;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
            color: blue;
        }
    </style>
</head>

<body>

    <h1>Events</h1>

    <h2>Keyboard Events</h2>

    <input type="text" id="keyboard"
           placeholder="Type something...">

    <p id="message">Press a key</p>

    <script>
        let input = document.getElementById("keyboard");
        let message = document.getElementById("message");

        // Keydown event
        input.addEventListener("keydown", function(event) {
            message.textContent =
                "Key Down: " + event.key;
        });

        // Keyup event
        input.addEventListener("keyup", function(event) {
            message.textContent =
                "Key Up: " + event.key;
        });
    </script>

</body>
</html>
