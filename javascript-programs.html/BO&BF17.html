<!DOCTYPE html>
<html>
<head>
    <title>Browser Language</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        #language {
            font-size: 25px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Current Browser Language</h1>

    <div id="language"></div>

    <script>
        let language = navigator.language;

        document.getElementById("language").innerHTML =
            "Browser Language: " + language;
    </script>

</body>
</html>
