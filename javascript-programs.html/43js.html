<!DOCTYPE html>
<html>
<head>
    <title>Q43 - Fetch API</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
        }

        button {
            padding: 10px 20px;
        }

        #result {
            margin-top: 20px;
            padding: 20px;
        }
    </style>
</head>

<body>

<h1>Fetch API</h1>

<button onclick="getData()">Fetch Data</button>

<div id="result"></div>

<script>

    function getData() {

        document.getElementById("result").innerHTML =
            "Loading...";

        fetch("https://jsonplaceholder.typicode.com/posts/1")
            .then(response => response.json())
            .then(data => {

                document.getElementById("result").innerHTML =
                    "<h2>" + data.title + "</h2>" +
                    "<p>" + data.body + "</p>";

            })
            .catch(error => {

                document.getElementById("result").innerHTML =
                    "Error loading data.";

            });
    }

</script>

</body>
</html>
