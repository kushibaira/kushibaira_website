<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>

        /* 1. Universal Selector */
        * {
            font-family: Arial, sans-serif;
        }

        /* 2. Element Selector */
        p {
            color: blue;
        }

        /* 3. Class Selector */
        .highlight {
            background-color: yellow;
            padding: 10px;
        }

        /* 4. ID Selector */
        #heading {
            color: red;
            text-align: center;
        }

        /* 5. Attribute Selector */
        input[type="text"] {
            border: 2px solid green;
            padding: 8px;
        }

        /* 6. Grouping Selector */
        h2, h3 {
            color: purple;
            text-align: center;
        }

    </style>
</head>

<body>

    <!-- ID Selector -->
    <h1 id="heading">CSS Selectors</h1>

    <!-- Element Selector -->
    <p>This paragraph uses an element selector.</p>

    <!-- Class Selector -->
    <p class="highlight">
        This paragraph uses a class selector.
    </p>

    <!-- Grouping Selector -->
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>

    <!-- Attribute Selector -->
    <label>Enter Your Name:</label>
    <br><br>

    <input type="text" placeholder="Enter name">

</body>
</html>
