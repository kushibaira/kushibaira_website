<!DOCTYPE html>
<html>
<head>
    <title>Navigator Object</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 10px 20px;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <h1>Navigator Object</h1>

    <button onclick="showNavigator()">Show Information</button>

    <div id="output"></div>

    <script>
        function showNavigator() {
            document.getElementById("output").innerHTML =
                "Browser: " + navigator.appName + "<br>" +
                "Platform: " + navigator.platform + "<br>" +
                "Language: " + navigator.language;
        }
    </script>

</body>
</html>
