<!DOCTYPE html>
<html>
<head>
    <title>Question 4 - Even or Odd</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Even or Odd</h1>

    <input type="number" id="number" placeholder="Enter number">
    <button onclick="checkNumber()">Check</button>

    <h2 id="result"></h2>

    <script>
        function checkNumber() {
            let num = Number(document.getElementById("number").value);

            if (num % 2 === 0) {
                document.getElementById("result").innerHTML =
                    num + " is Even";
            } else {
                document.getElementById("result").innerHTML =
                    num + " is Odd";
            }
        }
    </script>

</body>
</html>
