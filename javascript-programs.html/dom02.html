<!DOCTYPE html>
<html>
<head>
    <title>Change HTML Content</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #content {
            font-size: 22px;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1>Change HTML Content</h1>

    <p id="content">Original content</p>

    <button onclick="changeContent()">Change Content</button>

    <script>

        function changeContent() {

            document.getElementById("content").innerHTML =
                "<b>New HTML content added using JavaScript!</b>";
        }

    </script>

</body>
</html>
