<!DOCTYPE html>
<html>
<head>
    <title>CSS Relative Units</title>

    <style>
        html {
            font-size: 16px;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .box {
            background-color: lightblue;
            border: 2px solid blue;
            margin: 20px;
            padding: 10px;
        }

        .em-box {
            font-size: 20px;
            padding: 2em;
        }

        .rem-box {
            font-size: 1.5rem;
            padding: 1rem;
        }

        .vw-box {
            width: 50vw;
            background-color: lightgreen;
        }

        .vh-box {
            height: 20vh;
            background-color: lightyellow;
        }

        .percentage-box {
            width: 70%;
            background-color: lightpink;
        }
    </style>
</head>

<body>

    <h1>CSS Relative Units</h1>

    <div class="box em-box">
        This box uses em units.
    </div>

    <div class="box rem-box">
        This box uses rem units.
    </div>

    <div class="box vw-box">
        This box uses vw units.
    </div>

    <div class="box vh-box">
        This box uses vh units.
    </div>

    <div class="box percentage-box">
        This box uses percentage units.
    </div>

</body>
</html>
