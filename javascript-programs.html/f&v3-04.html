<!DOCTYPE html>
<html>
<head>
    <title>Age Validation</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Age Validation</h1>

    <input type="number" id="age" placeholder="Enter age">
    <button onclick="validateAge()">Validate</button>

    <p id="message"></p>

    <script>
        function validateAge() {
            let age = document.getElementById("age").value;

            if (age === "") {
                document.getElementById("message").textContent =
                    "Please enter your age.";
            } else if (age >= 1 && age <= 100) {
                document.getElementById("message").textContent =
                    "Valid age.";
            } else {
                document.getElementById("message").textContent =
                    "Please enter an age between 1 and 100.";
            }
        }
    </script>

</body>
</html>
