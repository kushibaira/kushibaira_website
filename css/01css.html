<!DOCTYPE html>
<html>
<head>
    <title>Types of CSS</title>

    <!-- Internal CSS -->
    <style>
        h2 {
            color: blue;
            text-align: center;
        }

        .internal {
            color: green;
            font-size: 20px;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 style="color: red; text-align: center;">
        Types of CSS
    </h1>

    <!-- Inline CSS -->
    <p style="color: purple; font-size: 18px;">
        This paragraph uses Inline CSS.
    </p>

    <!-- Internal CSS -->
    <h2>Internal CSS Example</h2>

    <p class="internal">
        This paragraph uses Internal CSS.
    </p>

    <!-- External CSS -->
    <p class="external">
        This paragraph uses External CSS.
    </p>

</body>
</html>
