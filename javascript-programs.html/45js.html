<!DOCTYPE html>
<html>
<head>
    <title>Q45 - Local Storage</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #eee;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>localStorage</h1>

    <input type="text" id="name" placeholder="Enter name">

    <br>

    <button onclick="saveData()">Save</button>
    <button onclick="getData()">Retrieve</button>
    <button onclick="clearData()">Clear</button>

    <h2 id="result"></h2>

</div>

<script>

    function saveData() {

        let name =
            document.getElementById("name").value;

        localStorage.setItem("studentName", name);

        document.getElementById("result").innerHTML =
            "Data saved successfully.";
    }


    function getData() {

        let name =
            localStorage.getItem("studentName");

        document.getElementById("result").innerHTML =
            name ? "Stored Name: " + name : "No data found.";
    }


    function clearData() {

        localStorage.removeItem("studentName");

        document.getElementById("result").innerHTML =
            "Data cleared.";
    }

</script>

</body>
</html>
