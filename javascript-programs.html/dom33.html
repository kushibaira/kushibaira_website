<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 10px;
            width: 250px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        li {
            margin: 10px;
            list-style: none;
        }
    </style>
</head>

<body>

    <h1>To-Do List</h1>

    <input type="text" id="task" placeholder="Enter a task">

    <button onclick="addTask()">Add Task</button>

    <ul id="taskList"></ul>

    <script>
        function addTask() {

            let task = document.getElementById("task").value;

            if (task === "") {
                alert("Please enter a task");
                return;
            }

            let li = document.createElement("li");

            li.textContent = task;

            document.getElementById("taskList").appendChild(li);

            document.getElementById("task").value = "";
        }
    </script>

</body>
</html>
