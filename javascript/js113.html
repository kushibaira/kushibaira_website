<!doctype html>
<title>113. Number guessing game</title>
<input id="guess" type="number" min="1" max="10"><button id="check">Guess</button><p id="result">Guess from 1 to 10.</p>
<script>
	const answer = Math.floor(Math.random() * 10) + 1;
	check.onclick = () => result.textContent = Number(guess.value) === answer ? "Correct!" : Number(guess.value) < answer ? "Try higher." : "Try lower.";
</script>
