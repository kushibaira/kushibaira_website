<!DOCTYPE html>
<html>
<head>
    <title>Q57 - Remove Duplicates</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

<h1>Remove Duplicate Elements</h1>

<input
    type="text"
    id="array"
    placeholder="10,20,10,30,20"
>

<button onclick="removeDuplicates()">
    Remove
</button>

<h2 id="result"></h2>

<script>

    function removeDuplicates() {

        let arr =
            document.getElementById("array").value
            .split(",")
            .map(item => item.trim());

        let unique =
            [...new Set(arr)];

        document.getElementById("result").innerHTML =
            "Unique Array: " + unique.join(", ");
    }

</script>

</body>
</html>
