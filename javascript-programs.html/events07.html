<!DOCTYPE html>
<html>
<head>
    <title>Keyboard Controlled Game</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        #gameArea {
            width: 500px;
            height: 300px;
            border: 2px solid black;
            margin: 30px auto;
            position: relative;
        }

        #player {
            width: 40px;
            height: 40px;
            background-color: blue;
            position: absolute;
            left: 230px;
            top: 130px;
        }

        #message {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Keyboard Controlled Game</h1>

    <p>Use the Arrow Keys to move the box.</p>

    <div id="gameArea">
        <div id="player"></div>
    </div>

    <p id="message">Press an arrow key.</p>

    <script>
        let player = document.getElementById("player");
        let message = document.getElementById("message");

        let x = 230;
        let y = 130;
        let speed = 10;

        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowUp") {
                y -= speed;
            }

            if (event.key === "ArrowDown") {
                y += speed;
            }

            if (event.key === "ArrowLeft") {
                x -= speed;
            }

            if (event.key === "ArrowRight") {
                x += speed;
            }

            // Keep the player inside the game area
            x = Math.max(0, Math.min(x, 460));
            y = Math.max(0, Math.min(y, 260));

            player.style.left = x + "px";
            player.style.top = y + "px";

            message.textContent =
                "Key pressed: " + event.key;
        });
    </script>

</body>
</html>
