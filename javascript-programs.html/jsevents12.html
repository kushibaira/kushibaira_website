<!DOCTYPE html>
<html>
<head>
    <title>Input Event</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Input Event</h1>

    <input type="text" oninput="showText(this.value)"
           placeholder="Type something">

    <p id="result"></p>

    <script>
        function showText(value) {
            document.getElementById("result").textContent =
                "You typed: " + value;
        }
    </script>

</body>
</html>
