<!DOCTYPE html>
<html>
<head>
    <title>User Avatars and Avatar Groups</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 850px;
            background-color: white;
            padding: 45px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 12px;
        }

        .description {
            text-align: center;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .section {
            margin-bottom: 35px;
        }

        .section h2 {
            color: #334155;
            margin-bottom: 20px;
        }

        .avatars {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .avatar-blue {
            background-color: #2563eb;
        }

        .avatar-green {
            background-color: #16a34a;
        }

        .avatar-purple {
            background-color: #7c3aed;
        }

        .avatar-orange {
            background-color: #ea580c;
        }

        .avatar-pink {
            background-color: #db2777;
        }

        .avatar-small {
            width: 45px;
            height: 45px;
            font-size: 14px;
        }

        .avatar-large {
            width: 90px;
            height: 90px;
            font-size: 28px;
        }

        .avatar-group {
            display: flex;
            align-items: center;
            padding-left: 12px;
        }

        .avatar-group .avatar {
            margin-left: -12px;
        }

        .more {
            background-color: #e2e8f0;
            color: #334155;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }

        .user-details h3 {
            color: #172554;
            margin-bottom: 5px;
        }

        .user-details p {
            color: #64748b;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>User Avatars and Avatar Groups</h1>

        <p class="description">
            Examples of individual user avatars and groups of
            avatars commonly used in modern web applications.
        </p>

        <div class="section">

            <h2>Individual User Avatars</h2>

            <div class="avatars">

                <div class="avatar avatar-blue">
                    AJ
                </div>

                <div class="avatar avatar-green">
                    SK
                </div>

                <div class="avatar avatar-purple">
                    RM
                </div>

                <div class="avatar avatar-orange">
                    JD
                </div>

                <div class="avatar avatar-pink">
                    AS
                </div>

            </div>

        </div>

        <div class="section">

            <h2>Different Avatar Sizes</h2>

            <div class="avatars">

                <div class="avatar avatar-small avatar-blue">
                    AB
                </div>

                <div class="avatar avatar-green">
                    CD
                </div>

                <div class="avatar avatar-large avatar-purple">
                    EF
                </div>

            </div>

        </div>

        <div class="section">

            <h2>Avatar Group</h2>

            <div class="avatar-group">

                <div class="avatar avatar-blue">
                    AJ
                </div>

                <div class="avatar avatar-green">
                    SK
                </div>

                <div class="avatar avatar-purple">
                    RM
                </div>

                <div class="avatar avatar-orange">
                    JD
                </div>

                <div class="avatar more">
                    +4
                </div>

            </div>

        </div>

        <div class="section">

            <h2>User Profile</h2>

            <div class="user-info">

                <div class="avatar avatar-large avatar-blue">
                    AS
                </div>

                <div class="user-details">
                    <h3>Alex Smith</h3>
                    <p>alex@example.com</p>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
