<!DOCTYPE html>
<html>
<head>
    <title>Drag and Drop Application</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        #dragItem {
            width: 120px;
            padding: 20px;
            margin: 30px auto;
            background-color: lightblue;
            cursor: grab;
        }

        #dropArea {
            width: 300px;
            height: 150px;
            margin: 20px auto;
            border: 2px dashed black;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #message {
            color: blue;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Drag and Drop Application</h1>

    <div id="dragItem" draggable="true">
        Drag Me
    </div>

    <div id="dropArea">
        Drop Here
    </div>

    <p id="message">Drag the box into the drop area.</p>

    <script>
        let dragItem = document.getElementById("dragItem");
        let dropArea = document.getElementById("dropArea");
        let message = document.getElementById("message");

        // Drag start event
        dragItem.addEventListener("dragstart", function(event) {
            event.dataTransfer.setData("text", event.target.id);
        });

        // Allow dropping
        dropArea.addEventListener("dragover", function(event) {
            event.preventDefault();
        });

        // Drop event
        dropArea.addEventListener("drop", function(event) {
            event.preventDefault();

            let id = event.dataTransfer.getData("text");
            let item = document.getElementById(id);

            dropArea.appendChild(item);

            message.textContent = "Item dropped successfully!";
        });
    </script>

</body>
</html>
