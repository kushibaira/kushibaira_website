<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Table Using JavaScript</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: lightblue;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>DOM Manipulation</h1>

    <h2>Dynamic Table Using JavaScript</h2>

    <button onclick="createTable()">
        Create Table
    </button>

    <div id="tableContainer"></div>

    <script>
        function createTable() {

            // Create table
            let table = document.createElement("table");

            // Create table heading
            let headerRow = document.createElement("tr");

            let nameHeader = document.createElement("th");
            nameHeader.textContent = "Name";

            let ageHeader = document.createElement("th");
            ageHeader.textContent = "Age";

            headerRow.appendChild(nameHeader);
            headerRow.appendChild(ageHeader);

            table.appendChild(headerRow);

            // Create first row
            let row1 = document.createElement("tr");

            let name1 = document.createElement("td");
            name1.textContent = "John";

            let age1 = document.createElement("td");
            age1.textContent = "20";

            row1.appendChild(name1);
            row1.appendChild(age1);

            table.appendChild(row1);

            // Create second row
            let row2 = document.createElement("tr");

            let name2 = document.createElement("td");
            name2.textContent = "Alice";

            let age2 = document.createElement("td");
            age2.textContent = "21";

            row2.appendChild(name2);
            row2.appendChild(age2);

            table.appendChild(row2);

            // Add table to webpage
            document.getElementById("tableContainer")
                .appendChild(table);
        }
    </script>

</body>
</html>
