<!DOCTYPE html>
<html>
<head>
    <title>Keyup Event</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Keyup Event</h1>

    <input type="text" onkeyup="keyUp()" placeholder="Type something">

    <p id="message"></p>

    <script>
        function keyUp() {
            document.getElementById("message").textContent =
                "You released a key!";
        }
    </script>

</body>
</html>
