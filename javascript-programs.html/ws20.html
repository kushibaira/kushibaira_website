<!DOCTYPE html>
<html>
<head>
    <title>Multi-Page Form using sessionStorage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 400px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
        }

        h2 {
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        .page {
            display: none;
        }

        .active {
            display: block;
        }

        #result {
            background-color: #f5f5f5;
            padding: 15px;
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Page 1 -->
        <div id="page1" class="page active">

            <h1>Registration Form</h1>
            <h2>Page 1 - Personal Details</h2>

            <label>Name:</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label>Age:</label>
            <input type="number" id="age" placeholder="Enter your age">

            <button onclick="nextPage()">Next</button>

        </div>


        <!-- Page 2 -->
        <div id="page2" class="page">

            <h2>Page 2 - Course Details</h2>

            <label>Course:</label>

            <select id="course">
                <option value="">Select Course</option>
                <option value="BCA">BCA</option>
                <option value="B.Sc Computer Science">
                    B.Sc Computer Science
                </option>
                <option value="B.Tech">B.Tech</option>
                <option value="MCA">MCA</option>
            </select>

            <label>College:</label>
            <input type="text" id="college" placeholder="Enter college name">

            <button onclick="previousPage()">Back</button>
            <button onclick="submitForm()">Submit</button>

        </div>


        <!-- Page 3 -->
        <div id="page3" class="page">

            <h2>Page 3 - Form Details</h2>

            <div id="result"></div>

            <button onclick="startAgain()">Start Again</button>

        </div>

    </div>


    <script>

        // Load previously saved data
        window.onload = function() {

            document.getElementById("name").value =
                sessionStorage.getItem("name") || "";

            document.getElementById("age").value =
                sessionStorage.getItem("age") || "";

            document.getElementById("course").value =
                sessionStorage.getItem("course") || "";

            document.getElementById("college").value =
                sessionStorage.getItem("college") || "";
        };


        // Go from Page 1 to Page 2
        function nextPage() {

            let name =
                document.getElementById("name").value;

            let age =
                document.getElementById("age").value;

            if (name == "" || age == "") {
                alert("Please enter name and age.");
                return;
            }

            // Store data in sessionStorage
            sessionStorage.setItem("name", name);
            sessionStorage.setItem("age", age);

            document.getElementById("page1")
                .classList.remove("active");

            document.getElementById("page2")
                .classList.add("active");
        }


        // Go back to Page 1
        function previousPage() {

            document.getElementById("page2")
                .classList.remove("active");

            document.getElementById("page1")
                .classList.add("active");
        }


        // Submit the form
        function submitForm() {

            let course =
                document.getElementById("course").value;

            let college =
                document.getElementById("college").value;

            if (course == "" || college == "") {
                alert("Please enter all details.");
                return;
            }

            // Store Page 2 data
            sessionStorage.setItem("course", course);
            sessionStorage.setItem("college", college);

            // Retrieve data
            let name =
                sessionStorage.getItem("name");

            let age =
                sessionStorage.getItem("age");

            // Display all data
            document.getElementById("result").innerHTML =
                "<b>Name:</b> " + name + "<br>" +
                "<b>Age:</b> " + age + "<br>" +
                "<b>Course:</b> " + course + "<br>" +
                "<b>College:</b> " + college;

            document.getElementById("page2")
                .classList.remove("active");

            document.getElementById("page3")
                .classList.add("active");
        }


        // Start again
        function startAgain() {

            sessionStorage.clear();

            document.getElementById("name").value = "";
            document.getElementById("age").value = "";
            document.getElementById("course").value = "";
            document.getElementById("college").value = "";

            document.getElementById("page3")
                .classList.remove("active");

            document.getElementById("page1")
                .classList.add("active");
        }

    </script>

</body>
</html>
