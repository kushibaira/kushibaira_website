<!DOCTYPE html>
<html>
<head>
    <title>Question 12 - Array Largest Smallest</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Largest and Smallest Array Element</h1>

    <input type="text" id="array"
           placeholder="Example: 10,20,5,30,15">

    <button onclick="findValues()">Find</button>

    <h2 id="result"></h2>

    <script>
        function findValues() {
            let arr = document.getElementById("array").value
                .split(",")
                .map(Number);

            let largest = Math.max(...arr);
            let smallest = Math.min(...arr);

            document.getElementById("result").innerHTML =
                "Largest: " + largest +
                "<br>Smallest: " + smallest;
        }
    </script>

</body>
</html>
