<!DOCTYPE html>
<html>
<head>
    <title>Employee Salary Calculator</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        #result {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Employee Salary Calculator</h1>

    <input type="text" id="name" placeholder="Employee Name">
    <br>

    <input type="number" id="basic" placeholder="Basic Salary">
    <br>

    <button onclick="calculateSalary()">Calculate</button>

    <div id="result"></div>

    <script>
        function calculateSalary() {
            let name = document.getElementById("name").value;
            let basic = Number(document.getElementById("basic").value);

            let allowance = basic * 0.20;
            let deduction = basic * 0.10;
            let netSalary = basic + allowance - deduction;

            document.getElementById("result").innerHTML =
                "Employee: " + name + "<br>" +
                "Basic Salary: " + basic.toFixed(2) + "<br>" +
                "Allowance: " + allowance.toFixed(2) + "<br>" +
                "Deduction: " + deduction.toFixed(2) + "<br>" +
                "Net Salary: " + netSalary.toFixed(2);
        }
    </script>

</body>
</html>
