<!DOCTYPE html>
<html>
<head>
    <title>Question 14 - Array Sum Average</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Array Sum and Average</h1>

    <input type="text" id="array"
           placeholder="Example: 10,20,30,40">

    <button onclick="calculate()">Calculate</button>

    <h2 id="result"></h2>

    <script>
        function calculate() {
            let arr = document.getElementById("array").value
                .split(",")
                .map(Number);

            let sum = arr.reduce((total, value) => total + value, 0);
            let average = sum / arr.length;

            document.getElementById("result").innerHTML =
                "Sum = " + sum +
                "<br>Average = " + average;
        }
    </script>

</body>
</html>
