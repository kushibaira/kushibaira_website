<!DOCTYPE html>
<html>
<head>
    <title>Retrieve localStorage Data</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 60px;
        }

        button {
            padding: 10px 20px;
        }

        #output {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>Retrieve Data from localStorage</h1>

    <button onclick="retrieveData()">Display Username</button>

    <div id="output"></div>

    <script>
        localStorage.setItem("username", "John");

        function retrieveData() {
            let username = localStorage.getItem("username");

            document.getElementById("output").innerHTML =
                "Username: " + username;
        }
    </script>

</body>
</html>
