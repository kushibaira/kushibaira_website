<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>CSS Selectors</title>

    <style>

        /* Universal Selector */
        * {
            font-family: Arial, sans-serif;
        }

        /* Element Selector */
        p {
            color: blue;
            font-size: 18px;
        }

        /* ID Selector */
        #heading {
            color: red;
            text-align: center;
        }

        /* Class Selector */
        .box {
            background-color: lightgreen;
            padding: 20px;
            margin: 20px;
            border: 3px solid green;
        }

        /* Group Selector */
        h2, h3 {
            text-align: center;
        }

    </style>
</head>

<body>

    <h1 id="heading">CSS Selectors Demo</h1>

    <h2>Welcome</h2>

    <p>This is an element selector.</p>

    <div class="box">
        This is a class selector.
    </div>

    <h3>CSS Properties</h3>

</body>
</html>
