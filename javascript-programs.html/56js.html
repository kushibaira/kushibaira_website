<!DOCTYPE html>
<html>
<head>
    <title>Q56 - Second Largest</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

<h1>Second Largest Element</h1>

<input
    type="text"
    id="array"
    placeholder="10,50,20,40,30"
>

<button onclick="findSecondLargest()">
    Find
</button>

<h2 id="result"></h2>

<script>

    function findSecondLargest() {

        let arr =
            document.getElementById("array").value
            .split(",")
            .map(Number);

        let unique =
            [...new Set(arr)];

        unique.sort((a, b) => b - a);

        if (unique.length < 2) {

            document.getElementById("result").innerHTML =
                "Need at least two different numbers.";

            return;
        }

        document.getElementById("result").innerHTML =
            "Second Largest = " + unique[1];
    }

</script>

</body>
</html>
