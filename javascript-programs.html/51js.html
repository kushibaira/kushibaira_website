<!DOCTYPE html>
<html>
<head>
    <title>Q51 - Armstrong Number</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 80px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

<h1>Armstrong Number</h1>

<input type="number" id="number" placeholder="Enter number">

<button onclick="checkArmstrong()">Check</button>

<h2 id="result"></h2>

<script>

    function checkArmstrong() {

        let number =
            Number(document.getElementById("number").value);

        let original = number;

        let digits = Math.abs(number)
            .toString()
            .length;

        let sum = 0;

        while (number > 0) {

            let digit = number % 10;

            sum += Math.pow(digit, digits);

            number = Math.floor(number / 10);
        }

        if (sum === original) {

            document.getElementById("result").innerHTML =
                original + " is an Armstrong number.";

        } else {

            document.getElementById("result").innerHTML =
                original + " is not an Armstrong number.";
        }
    }

</script>

</body>
</html>
