<!DOCTYPE html>
<html>
<head>
    <title>Q42 - Callbacks Promises Async Await</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
            background: #eee;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
        }

        #result {
            margin-top: 20px;
            line-height: 2;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Async JavaScript</h1>

    <button onclick="callbackExample()">Callback</button>
    <button onclick="promiseExample()">Promise</button>
    <button onclick="asyncExample()">Async/Await</button>

    <div id="result"></div>

</div>

<script>

    function callbackExample() {

        setTimeout(function() {

            document.getElementById("result").innerHTML =
                "Callback executed successfully.";

        }, 1000);
    }


    function promiseExample() {

        let promise = new Promise(function(resolve) {

            setTimeout(function() {
                resolve("Promise completed successfully.");
            }, 1000);

        });

        promise.then(function(message) {

            document.getElementById("result").innerHTML =
                message;

        });
    }


    async function asyncExample() {

        let message = await new Promise(function(resolve) {

            setTimeout(function() {
                resolve("Async/Await completed successfully.");
            }, 1000);

        });

        document.getElementById("result").innerHTML =
            message;
    }

</script>

</body>
</html>
