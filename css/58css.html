<!DOCTYPE html>
<html>
<head>
    <title>SaaS Landing Page Header</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            color: #222;
        }

        .header {
            background: linear-gradient(135deg, #172554, #2563eb);
            color: white;
            min-height: 100vh;
            padding: 25px 8%;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .nav-links a:hover {
            color: #bfdbfe;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .login-button,
        .signup-button {
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .login-button {
            color: white;
            border: 1px solid white;
        }

        .signup-button {
            background-color: white;
            color: #172554;
        }

        .hero {
            max-width: 900px;
            margin: 130px auto;
            text-align: center;
        }

        .badge {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.15);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 52px;
            line-height: 1.15;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 650px;
            margin: 0 auto 30px;
            color: #dbeafe;
            font-size: 18px;
            line-height: 1.7;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .primary-button,
        .secondary-button {
            padding: 14px 26px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
        }

        .primary-button {
            background-color: white;
            color: #172554;
        }

        .secondary-button {
            border: 1px solid white;
            color: white;
        }

        .primary-button:hover {
            background-color: #dbeafe;
        }

        .secondary-button:hover {
            background-color: rgba(255, 255, 255, 0.12);
        }

        @media (max-width: 800px) {
            .navbar {
                flex-wrap: wrap;
                gap: 20px;
            }

            .nav-links {
                order: 3;
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .hero {
                margin: 90px auto;
            }

            .hero h1 {
                font-size: 40px;
            }
        }

        @media (max-width: 500px) {
            .header {
                padding: 20px;
            }

            .logo {
                font-size: 22px;
            }

            .header-buttons {
                gap: 5px;
            }

            .login-button,
            .signup-button {
                padding: 8px 12px;
            }

            .hero {
                margin: 70px auto;
            }

            .hero h1 {
                font-size: 32px;
            }

            .hero p {
                font-size: 15px;
            }

            .hero-buttons {
                flex-direction: column;
            }

            .primary-button,
            .secondary-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header class="header">

        <nav class="navbar">

            <div class="logo">
                CloudFlow
            </div>

            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Features</a></li>
                <li><a href="#">Pricing</a></li>
                <li><a href="#">Resources</a></li>
            </ul>

            <div class="header-buttons">
                <a href="#" class="login-button">Login</a>
                <a href="#" class="signup-button">Sign Up</a>
            </div>

        </nav>


        <div class="hero">

            <div class="badge">
                Powerful SaaS Platform
            </div>

            <h1>
                Manage Your Business Smarter
            </h1>

            <p>
                CloudFlow helps teams manage projects, customers,
                analytics, and daily business operations from one
                simple and powerful platform.
            </p>

            <div class="hero-buttons">

                <a href="#" class="primary-button">
                    Get Started
                </a>

                <a href="#" class="secondary-button">
                    Learn More
                </a>

            </div>

        </div>

    </header>

</body>
</html>
