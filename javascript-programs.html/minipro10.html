<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        input {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 500px;
        }

        th, td {
            border: 1px solid #999;
            padding: 10px;
        }

        #total {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Expense Tracker</h1>

    <input type="text" id="description" placeholder="Expense Description">

    <input type="number" id="amount" placeholder="Amount">

    <button onclick="addExpense()">Add Expense</button>

    <table>
        <tr>
            <th>Description</th>
            <th>Amount</th>
            <th>Action</th>
        </tr>

        <tbody id="expenseList"></tbody>
    </table>

    <p id="total">Total: ₹0</p>

    <script>

        let total = 0;

        function addExpense() {

            let description =
                document.getElementById("description").value;

            let amount =
                Number(document.getElementById("amount").value);

            if (description === "" || amount <= 0) {
                alert("Please enter valid expense details");
                return;
            }

            let row = document.createElement("tr");

            row.innerHTML =
                "<td>" + description + "</td>" +
                "<td>₹" + amount + "</td>" +
                '<td><button onclick="deleteExpense(this, ' +
                amount + ')">Delete</button></td>';

            document.getElementById("expenseList").appendChild(row);

            total = total + amount;

            document.getElementById("total").innerHTML =
                "Total: ₹" + total;

            document.getElementById("description").value = "";
            document.getElementById("amount").value = "";
        }

        function deleteExpense(button, amount) {

            button.parentElement.parentElement.remove();

            total = total - amount;

            document.getElementById("total").innerHTML =
                "Total: ₹" + total;
        }

    </script>

</body>
</html>
