<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>500 - Server Error</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#fff7ed;color:#292524;min-height:100vh;display:grid;place-items:center;text-align:center}
.box{padding:40px}
.error{font-size:120px;font-weight:bold;color:#ea580c;margin:0}
.btn{display:inline-block;background:#ea580c;color:white;text-decoration:none;padding:12px 22px;border-radius:8px;margin-top:20px}
</style>
</head>
<body>
<div class="box">
<div class="error">500</div>
<h1>Something Went Wrong</h1>
<p>Our server encountered an unexpected error. Please try again later.</p>
<a class="btn" href="#">Return Home</a>
</div>
</body>
</html>
