<!doctype html>
<title>174. Multiple buttons</title>
<button id="red">Red</button><button id="blue">Blue</button><button id="reset">Reset</button>
<script>
	red.onclick = () => document.body.style.color = "red";
	blue.onclick = () => document.body.style.color = "blue";
	reset.onclick = () => document.body.style.color = "black";
</script>
