<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .forgot-container {
            width: 90%;
            max-width: 440px;
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background-color: #dbeafe;
            color: #2563eb;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
        }

        h1 {
            color: #172554;
            margin-bottom: 12px;
        }

        .description {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        .reset-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-button:hover {
            background-color: #1d4ed8;
        }

        .back-login {
            display: inline-block;
            margin-top: 25px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        .note {
            margin-top: 20px;
            padding: 14px;
            background-color: #f8fafc;
            border-radius: 8px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 500px) {
            .forgot-container {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="forgot-container">

        <div class="icon">
            ?
        </div>

        <h1>Forgot Password?</h1>

        <p class="description">
            Enter your email address and we will send you
            instructions to reset your password.
        </p>

        <form>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    required
                >
            </div>

            <button type="submit" class="reset-button">
                Send Reset Link
            </button>

        </form>

        <div class="note">
            Check your email inbox and spam folder for
            the password reset instructions.
        </div>

        <a href="#" class="back-login">
            ← Back to Login
        </a>

    </div>

</body>
</html>
