<!DOCTYPE html>
<html>
<head>
    <title>Add and Delete Rows</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: lightblue;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>DOM Manipulation</h1>

    <h2>Add and Delete Rows from a Table</h2>

    <table id="studentTable">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>John</td>
            <td>20</td>
            <td>
                <button onclick="deleteRow(this)">Delete</button>
            </td>
        </tr>
    </table>

    <button onclick="addRow()">
        Add Row
    </button>

    <script>
        function addRow() {

            // Get the table
            let table = document.getElementById("studentTable");

            // Insert a new row
            let row = table.insertRow();

            // Insert cells
            let cell1 = row.insertCell(0);
            let cell2 = row.insertCell(1);
            let cell3 = row.insertCell(2);

            // Add data
            cell1.textContent = "Alice";
            cell2.textContent = "21";

            // Add delete button
            cell3.innerHTML =
                '<button onclick="deleteRow(this)">Delete</button>';
        }

        function deleteRow(button) {

            // Delete the selected row
            let row = button.parentNode.parentNode;
            row.remove();
        }
    </script>

</body>
</html>
