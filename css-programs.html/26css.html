<!DOCTYPE html>
<html>
<head>
    <title>CSS Spacing Utilities</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .box {
            background-color: lightblue;
            border: 2px solid blue;
            padding: 20px;
            margin: 20px;
        }

        /* Margin Utilities */
        .margin-small {
            margin: 10px;
        }

        .margin-large {
            margin: 40px;
        }

        /* Padding Utilities */
        .padding-small {
            padding: 10px;
        }

        .padding-large {
            padding: 40px;
        }

        /* Individual Spacing */
        .custom-spacing {
            margin-top: 30px;
            margin-bottom: 20px;
            padding-left: 40px;
            padding-right: 40px;
            background-color: lightgreen;
            border: 2px solid green;
        }
    </style>
</head>

<body>

    <h1>CSS Spacing Utilities</h1>

    <div class="box margin-small">
        Small Margin
    </div>

    <div class="box margin-large">
        Large Margin
    </div>

    <div class="box padding-small">
        Small Padding
    </div>

    <div class="box padding-large">
        Large Padding
    </div>

    <div class="custom-spacing">
        Custom Margin and Padding
    </div>

</body>
</html>
