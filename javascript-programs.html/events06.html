<!DOCTYPE html>
<html>
<head>
    <title>Event Delegation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            width: 200px;
            padding: 12px;
            margin: 8px auto;
            background-color: lightblue;
            cursor: pointer;
        }

        #message {
            color: blue;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Event Delegation</h1>

    <ul id="itemList">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
    </ul>

    <p id="message">Click any item.</p>

    <script>
        let itemList = document.getElementById("itemList");
        let message = document.getElementById("message");

        // Event delegation
        itemList.addEventListener("click", function(event) {

            if (event.target.tagName === "LI") {
                message.textContent =
                    "You clicked: " + event.target.textContent;
            }

        });
    </script>

</body>
</html>
