<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SaaS Team Management System</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb;color:#1e293b}
.wrap{max-width:1100px;margin:auto;padding:25px}
header{display:flex;justify-content:space-between;align-items:center}
.btn{background:#2563eb;color:white;border:0;padding:11px 18px;border-radius:8px}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:25px}
.card{background:white;padding:22px;border-radius:14px;box-shadow:0 4px 15px #0001}
.members{display:flex;margin:18px 0}
.member{width:42px;height:42px;border-radius:50%;background:#dbeafe;border:3px solid white;display:grid;place-items:center;margin-left:-8px}
.member:first-child{margin-left:0}
.role{color:#64748b}
@media(max-width:750px){.team{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.team{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>Team Management</h1><p>Organize teams and collaborate effectively.</p></div><button class="btn">Create Team</button></header>
<div class="team">
<div class="card"><h2>Engineering</h2><p class="role">Software Development</p><div class="members"><div class="member">AS</div><div class="member">PR</div><div class="member">RK</div><div class="member">+4</div></div><p>7 members</p></div>
<div class="card"><h2>Marketing</h2><p class="role">Marketing & Growth</p><div class="members"><div class="member">MK</div><div class="member">SJ</div><div class="member">+2</div></div><p>4 members</p></div>
<div class="card"><h2>Design</h2><p class="role">Product Design</p><div class="members"><div class="member">AN</div><div class="member">VP</div></div><p>2 members</p></div>
</div>
</div>
</body>
</html>
