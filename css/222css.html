<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile First SaaS Layout</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .layout {
            display: flex;
            flex-direction: column;
        }

        aside {
            background: #1e293b;
            color: white;
            padding: 20px;
        }

        aside a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 6px;
        }

        aside a:hover {
            background: #334155;
        }

        main {
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        @media (min-width: 768px) {
            .layout {
                flex-direction: row;
            }

            aside {
                width: 230px;
                min-height: calc(100vh - 68px);
            }

            main {
                flex: 1;
            }

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1100px) {
            .cards {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>SaaS Dashboard</h1>
    </header>

    <div class="layout">

        <aside>
            <h2>Menu</h2>
            <br>
            <a href="#">Dashboard</a>
            <a href="#">Analytics</a>
            <a href="#">Users</a>
            <a href="#">Settings</a>
        </aside>

        <main>
            <h2>Overview</h2>
            <br>

            <div class="cards">
                <div class="card">
                    <h3>Total Users</h3>
                    <p>12,450</p>
                </div>

                <div class="card">
                    <h3>Revenue</h3>
                    <p>$24,500</p>
                </div>

                <div class="card">
                    <h3>Orders</h3>
                    <p>1,250</p>
                </div>
            </div>
        </main>

    </div>

</body>
</html>
