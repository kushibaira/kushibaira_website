<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Sliding Card Animation</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            padding: 50px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        .cards {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            position: relative;
            height: 250px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .content {
            padding: 30px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .slide {
            position: absolute;
            left: -100%;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: #2563eb;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
            transition: left 0.5s ease;
        }

        .card:hover .slide {
            left: 0;
        }

        .card h2 {
            margin-bottom: 10px;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Sliding Card Animation</h1>

    <div class="cards">

        <div class="card">
            <div class="content">
                <h2>Analytics</h2>
                <p>Hover over the card.</p>
            </div>

            <div class="slide">
                <div>
                    <h2>Analytics</h2>
                    <p>View detailed business analytics.</p>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="content">
                <h2>Users</h2>
                <p>Hover over the card.</p>
            </div>

            <div class="slide">
                <div>
                    <h2>Users</h2>
                    <p>Manage all your users easily.</p>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="content">
                <h2>Reports</h2>
                <p>Hover over the card.</p>
            </div>

            <div class="slide">
                <div>
                    <h2>Reports</h2>
                    <p>Create and download reports.</p>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
