<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Sizing</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Content-box */
        .content-box {
            box-sizing: content-box;
            width: 250px;
            padding: 20px;
            border: 5px solid red;
            background-color: lightyellow;
        }

        /* Border-box */
        .border-box {
            box-sizing: border-box;
            width: 250px;
            padding: 20px;
            border: 5px solid green;
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <h1>CSS Box-Sizing Property</h1>

    <div class="container">

        <div class="content-box">
            <h2>Content Box</h2>
            <p>
                Width includes only the content.
                Padding and border are added separately.
            </p>
        </div>

        <div class="border-box">
            <h2>Border Box</h2>
            <p>
                Width includes content, padding and border.
            </p>
        </div>

    </div>

</body>
</html>
