<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Dropdown List</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        select {
            padding: 10px;
            width: 250px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>DOM Manipulation</h1>

    <h2>Dynamic Dropdown List</h2>

    <select id="course">
        <option value="">Select a course</option>
    </select>

    <br>

    <button onclick="addCourses()">
        Add Courses
    </button>

    <script>
        function addCourses() {

            // List of courses
            let courses = [
                "HTML",
                "CSS",
                "JavaScript",
                "Python"
            ];

            // Get dropdown
            let dropdown = document.getElementById("course");

            // Add courses dynamically
            for (let i = 0; i < courses.length; i++) {

                let option = document.createElement("option");

                option.textContent = courses[i];
                option.value = courses[i];

                dropdown.appendChild(option);
            }
        }
    </script>

</body>
</html>
