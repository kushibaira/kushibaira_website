<!DOCTYPE html>
<html>
<head>
    <title>Click Counter</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
        }

        #count {
            font-size: 25px;
        }
    </style>
</head>
<body>

    <h1>Click Counter</h1>

    <button onclick="increaseCount()">Click Me</button>

    <p id="count">Clicks: 0</p>

    <script>
        let count = 0;

        function increaseCount() {
            count++;

            document.getElementById("count").textContent =
                "Clicks: " + count;
        }
    </script>

</body>
</html>
