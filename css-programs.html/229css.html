<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated SaaS Cards</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 35px;
        }

        .cards {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            animation: cardEntry 1s ease forwards;
            opacity: 0;
        }

        .card:nth-child(1) {
            animation-delay: 0.2s;
        }

        .card:nth-child(2) {
            animation-delay: 0.4s;
        }

        .card:nth-child(3) {
            animation-delay: 0.6s;
        }

        .icon {
            font-size: 45px;
            margin-bottom: 15px;
            animation: floatIcon 2s ease-in-out infinite;
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .card p {
            color: #666;
        }

        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floatIcon {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Animated SaaS Components</h1>

    <div class="cards">

        <div class="card">
            <div class="icon">🚀</div>
            <h2>Performance</h2>
            <p>Improve application performance.</p>
        </div>

        <div class="card">
            <div class="icon">📈</div>
            <h2>Analytics</h2>
            <p>Monitor business growth.</p>
        </div>

        <div class="card">
            <div class="icon">🔒</div>
            <h2>Security</h2>
            <p>Keep your data protected.</p>
        </div>

    </div>

</body>
</html>
