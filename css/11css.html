<!DOCTYPE html>
<html>
<head>
    <title>CSS Dimensions</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        /* Fixed Width and Height */
        .fixed {
            width: 300px;
            height: 100px;
            background-color: lightblue;
            padding: 20px;
            margin: 20px;
        }

        /* Percentage Width */
        .percentage {
            width: 70%;
            height: 100px;
            background-color: lightgreen;
            padding: 20px;
            margin: 20px;
        }

        /* Maximum Width */
        .maximum {
            max-width: 500px;
            height: 100px;
            background-color: lightyellow;
            padding: 20px;
            margin: 20px;
        }

        /* Minimum Height */
        .minimum {
            min-height: 150px;
            background-color: lightpink;
            padding: 20px;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Dimensions</h1>

    <div class="fixed">
        Fixed Width: 300px <br>
        Fixed Height: 100px
    </div>

    <div class="percentage">
        Width: 70%
    </div>

    <div class="maximum">
        Maximum Width: 500px
    </div>

    <div class="minimum">
        Minimum Height: 150px
    </div>

</body>
</html>
