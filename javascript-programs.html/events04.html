<!DOCTYPE html>
<html>
<head>
    <title>Double Click Event</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        #box {
            width: 300px;
            height: 150px;
            margin: 30px auto;
            background-color: lightblue;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }

        #message {
            font-size: 20px;
            color: blue;
        }
    </style>
</head>

<body>

    <h1>Events</h1>

    <h2>Double-Click Event</h2>

    <div id="box">
        Double-Click Me
    </div>

    <p id="message">Waiting for double-click...</p>

    <script>
        let box = document.getElementById("box");
        let message = document.getElementById("message");

        // Double-click event
        box.addEventListener("dblclick", function() {

            message.textContent =
                "The box was double-clicked!";

            box.style.backgroundColor = "lightgreen";
        });
    </script>

</body>
</html>
