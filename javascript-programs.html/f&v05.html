<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        #success {
            color: green;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Feedback Form</h1>

    <form id="feedbackForm">

        <label>Name:</label>
        <input type="text" id="name">
        <p id="nameError" class="error"></p>

        <label>Email:</label>
        <input type="email" id="email">
        <p id="emailError" class="error"></p>

        <label>Rating:</label>
        <select id="rating">
            <option value="">Select Rating</option>
            <option value="5">Excellent</option>
            <option value="4">Very Good</option>
            <option value="3">Good</option>
            <option value="2">Poor</option>
            <option value="1">Very Poor</option>
        </select>
        <p id="ratingError" class="error"></p>

        <label>Feedback:</label>
        <textarea id="feedback"></textarea>
        <p id="feedbackError" class="error"></p>

        <button type="submit">Submit Feedback</button>

        <p id="success"></p>

    </form>

</div>

<script>

    let form = document.getElementById("feedbackForm");

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let rating = document.getElementById("rating").value;
        let feedback = document.getElementById("feedback").value.trim();

        let nameError = document.getElementById("nameError");
        let emailError = document.getElementById("emailError");
        let ratingError = document.getElementById("ratingError");
        let feedbackError = document.getElementById("feedbackError");
        let success = document.getElementById("success");

        nameError.textContent = "";
        emailError.textContent = "";
        ratingError.textContent = "";
        feedbackError.textContent = "";
        success.textContent = "";

        let valid = true;

        // Name validation
        if (name === "") {
            nameError.textContent = "Name is required";
            valid = false;
        }

        // Email validation
        if (email === "") {
            emailError.textContent = "Email is required";
            valid = false;
        }

        // Rating validation
        if (rating === "") {
            ratingError.textContent = "Please select a rating";
            valid = false;
        }

        // Feedback validation
        if (feedback === "") {
            feedbackError.textContent = "Feedback is required";
            valid = false;
        }

        // Successful submission
        if (valid) {
            success.textContent =
                "Feedback submitted successfully!";

            form.reset();
        }

    });

</script>

</body>
</html>
