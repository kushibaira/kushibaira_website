<!doctype html>
<title>198. Gender validation</title>
<select id="gender"><option value="">Choose gender</option><option>Female</option><option>Male</option><option>Other</option></select><button id="check">Validate</button><p id="result"></p>
<script>
	check.onclick = () => result.textContent = gender.value ? "Gender selected" : "Select a gender";
</script>
