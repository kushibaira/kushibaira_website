<!DOCTYPE html>
<html>
<head>
    <title>Temporary Form Data</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        form {
            display: inline-block;
        }
    </style>
</head>

<body>

    <h1>Temporary Form Data</h1>

    <form>
        <input
            type="text"
            id="name"
            placeholder="Enter name"
            oninput="saveData()"
        >
        <br>

        <input
            type="email"
            id="email"
            placeholder="Enter email"
            oninput="saveData()"
        >
        <br>

        <button type="button" onclick="clearData()">
            Clear
        </button>
    </form>

    <script>
        window.onload = function() {
            document.getElementById("name").value =
                sessionStorage.getItem("name") || "";

            document.getElementById("email").value =
                sessionStorage.getItem("email") || "";
        };

        function saveData() {
            sessionStorage.setItem(
                "name",
                document.getElementById("name").value
            );

            sessionStorage.setItem(
                "email",
                document.getElementById("email").value
            );
        }

        function clearData() {
            sessionStorage.clear();

            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
        }
    </script>

</body>
</html>
