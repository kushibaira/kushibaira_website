<!DOCTYPE html>
<html>
<head>
    <title>Font Size Preference</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
        }

        #content {
            font-size: 20px;
            margin: 30px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <h1>Font Size Preference</h1>

    <div id="content">
        This text changes its font size.
    </div>

    <button onclick="changeSize(16)">Small</button>
    <button onclick="changeSize(24)">Medium</button>
    <button onclick="changeSize(32)">Large</button>

    <script>
        function changeSize(size) {
            document.getElementById("content").style.fontSize =
                size + "px";

            localStorage.setItem("fontSize", size);
        }

        window.onload = function() {
            let savedSize =
                localStorage.getItem("fontSize");

            if (savedSize) {
                changeSize(savedSize);
            }
        };
    </script>

</body>
</html>
