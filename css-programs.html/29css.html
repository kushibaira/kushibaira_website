<!DOCTYPE html>
<html>
<head>
    <title>CSS Object Fit and Position</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .box {
            width: 250px;
            height: 200px;
            border: 3px solid blue;
        }

        img {
            width: 100%;
            height: 100%;
        }

        .cover {
            object-fit: cover;
        }

        .contain {
            object-fit: contain;
            background-color: white;
        }

        .fill {
            object-fit: fill;
        }

        .position {
            object-fit: cover;
            object-position: top;
        }
    </style>
</head>

<body>

    <h1>CSS Object-Fit and Object-Position</h1>

    <div class="container">

        <div>
            <h3>Object Fit: Cover</h3>
            <div class="box">
                <img src="https://picsum.photos/id/1015/500/300"
                     class="cover"
                     alt="Cover Image">
            </div>
        </div>

        <div>
            <h3>Object Fit: Contain</h3>
            <div class="box">
                <img src="https://picsum.photos/id/1015/500/300"
                     class="contain"
                     alt="Contain Image">
            </div>
        </div>

        <div>
            <h3>Object Fit: Fill</h3>
            <div class="box">
                <img src="https://picsum.photos/id/1015/500/300"
                     class="fill"
                     alt="Fill Image">
            </div>
        </div>

        <div>
            <h3>Object Position: Top</h3>
            <div class="box">
                <img src="https://picsum.photos/id/1015/500/300"
                     class="position"
                     alt="Top Position Image">
            </div>
        </div>

    </div>

</body>
</html>
