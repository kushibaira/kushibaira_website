<!DOCTYPE html>
<html>
<head>
    <title>Mouseover and Mouseout</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        #box {
            width: 200px;
            padding: 40px;
            margin: auto;
            background-color: lightblue;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>Mouse Events</h1>

    <div id="box"
         onmouseover="mouseOver()"
         onmouseout="mouseOut()">
        Move Mouse Here
    </div>

    <script>
        function mouseOver() {
            document.getElementById("box").textContent = "Mouse is over me!";
        }

        function mouseOut() {
            document.getElementById("box").textContent = "Mouse moved out!";
        }
    </script>

</body>
</html>
