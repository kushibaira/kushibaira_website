<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Only Modal</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{min-height:100vh;background:#f1f5f9;display:flex;align-items:center;justify-content:center}
.btn{background:#2563eb;color:white;padding:13px 22px;border-radius:8px;text-decoration:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
.modal:target{display:flex}
.box{background:white;width:90%;max-width:450px;padding:30px;border-radius:14px;position:relative}
.box h2{margin-bottom:12px}
.box p{color:#64748b;line-height:1.6}
.close{position:absolute;right:18px;top:15px;text-decoration:none;font-size:25px;color:#64748b}
.actions{margin-top:25px;display:flex;gap:10px}
.action{padding:10px 18px;border-radius:7px;text-decoration:none}
.confirm{background:#2563eb;color:white}
.cancel{background:#e5e7eb;color:#374151}
</style>
</head>

<body>

<a href="#modal" class="btn">Open Modal</a>

<div id="modal" class="modal">
  <div class="box">
    <a href="#" class="close">&times;</a>
    <h2>Confirm Action</h2>
    <p>
      This is a CSS-only modal window. No JavaScript is
      required to open or close this popup.
    </p>

    <div class="actions">
      <a href="#" class="action cancel">Cancel</a>
      <a href="#" class="action confirm">Confirm</a>
    </div>
  </div>
</div>

</body>
</html>
