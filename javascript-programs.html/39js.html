<!DOCTYPE html>
<html>
<head>
    <title>Q39 - Spread and Rest</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f5f5f5;
            padding: 50px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
        }

        #result {
            margin-top: 20px;
            line-height: 2;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Spread and Rest Operators</h1>

    <button onclick="showResult()">Run</button>

    <div id="result"></div>
</div>

<script>
    function showResult() {

        let numbers1 = [10, 20, 30];
        let numbers2 = [40, 50, 60];

        let merged = [...numbers1, ...numbers2];

        function sum(...numbers) {
            return numbers.reduce((total, n) => total + n, 0);
        }

        document.getElementById("result").innerHTML =
            "Array 1: " + numbers1.join(", ") + "<br>" +
            "Array 2: " + numbers2.join(", ") + "<br>" +
            "Merged using Spread: " + merged.join(", ") + "<br>" +
            "Sum using Rest: " + sum(...merged);
    }
</script>

</body>
</html>
