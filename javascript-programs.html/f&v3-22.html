<!DOCTYPE html>
<html>
<head>
    <title>Phone Regex Validation</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Phone Number Validation</h1>

    <input type="text" id="phone" placeholder="Enter phone number">
    <button onclick="validatePhone()">Validate</button>

    <p id="message"></p>

    <script>
        function validatePhone() {
            let phone = document.getElementById("phone").value;

            let pattern = /^[0-9]{10}$/;

            if (pattern.test(phone)) {
                document.getElementById("message").textContent =
                    "Valid phone number.";
            } else {
                document.getElementById("message").textContent =
                    "Invalid phone number.";
            }
        }
    </script>

</body>
</html>
