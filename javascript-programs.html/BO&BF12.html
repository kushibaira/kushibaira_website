<!DOCTYPE html>
<html>
<head>
    <title>Browser Operations</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            cursor: pointer;

<body>

    <h1>Browser Operations</h1>

    <button onclick="history.forward()">Forward</button>

    <button onclick="location.reload()">Reload</button>

</body>
</html>
