<!DOCTYPE html>
<html>
<head>
    <title>CSS Colors and UI</title>

    <style>

        /* Body Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        /* Heading Colors */
        h1 {
            color: blue;
            text-align: center;
        }

        /* Text Color */
        .text {
            color: darkgreen;
            font-size: 20px;
        }

        /* Background Color */
        .background {
            background-color: lightyellow;
            padding: 20px;
        }

        /* Border Styling */
        .border {
            border: 3px solid red;
            padding: 15px;
            margin-top: 15px;
        }

        /* Button UI */
        button {
            background-color: green;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Button Hover Effect */
        button:hover {
            background-color: darkgreen;
        }

        /* Card UI */
        .card {
            background-color: white;
            border: 1px solid gray;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
        }

    </style>
</head>

<body>

    <h1>CSS Colors and UI</h1>

    <p class="text">
        This paragraph demonstrates text color and font size.
    </p>

    <div class="background">
        This section demonstrates background color.
    </div>

    <div class="border">
        This section demonstrates border styling.
    </div>

    <div class="card">
        <h2>Student Card</h2>

        <p>
            Name: BAIRA
        </p>

        <p>
            Course: B.Tech
        </p>

        <button>Click Me</button>
    </div>

</body>
</html>
