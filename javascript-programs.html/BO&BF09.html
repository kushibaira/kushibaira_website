<!DOCTYPE html>
<html>
<head>
    <title>Redirect Page</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Redirect Example</h1>

    <button onclick="redirectPage()">Go to Example</button>

    <script>
        function redirectPage() {
            window.location.href = "https://example.com";
        }
    </script>

</body>
</html>
