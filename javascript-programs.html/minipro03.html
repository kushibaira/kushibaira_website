<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        #display {
            font-size: 45px;
            margin: 20px;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Stopwatch</h1>

    <div id="display">00:00:00</div>

    <button onclick="start()">Start</button>
    <button onclick="stop()">Stop</button>
    <button onclick="reset()">Reset</button>

    <script>

        let seconds = 0;
        let timer = null;

        function start() {

            if (timer === null) {

                timer = setInterval(function() {

                    seconds++;

                    let hrs = Math.floor(seconds / 3600);
                    let mins = Math.floor((seconds % 3600) / 60);
                    let secs = seconds % 60;

                    document.getElementById("display").innerHTML =
                        String(hrs).padStart(2, "0") + ":" +
                        String(mins).padStart(2, "0") + ":" +
                        String(secs).padStart(2, "0");

                }, 1000);
            }
        }

        function stop() {

            clearInterval(timer);
            timer = null;
        }

        function reset() {

            stop();

            seconds = 0;

            document.getElementById("display").innerHTML =
                "00:00:00";
        }

    </script>

</body>
</html>
