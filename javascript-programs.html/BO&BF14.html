<!DOCTYPE html>
<html>
<head>
    <title>Browser Information</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        #info {
            margin: 20px auto;
            width: 70%;
            padding: 20px;
            border: 1px solid black;
            text-align: left;
        }
    </style>
</head>
<body>

    <h1>Browser Information</h1>

    <div id="info"></div>

    <script>
        document.getElementById("info").innerHTML =
            "<b>Browser:</b> " + navigator.appName + "<br>" +
            "<b>Browser Version:</b> " + navigator.appVersion + "<br>" +
            "<b>Platform:</b> " + navigator.platform + "<br>" +
            "<b>Language:</b> " + navigator.language + "<br>" +
            "<b>Cookies Enabled:</b> " + navigator.cookieEnabled;
    </script>

</body>
</html>
