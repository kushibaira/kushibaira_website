<!DOCTYPE html>
<html>
<head>
    <title>Quiz Application</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        .quiz {
            width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
            cursor: pointer;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="quiz">
        <h1>Quiz Application</h1>

        <h2 id="question"></h2>

        <div id="options"></div>

        <button onclick="nextQuestion()">Next</button>

        <p id="result"></p>
    </div>

    <script>

        let questions = [
            {
                question: "What does HTML stand for?",
                options: [
                    "Hyper Text Markup Language",
                    "High Text Machine Language",
                    "Hyperlink Text Mark Language",
                    "Home Tool Markup Language"
                ],
                answer: 0
            },

            {
                question: "Which language is used for styling webpages?",
                options: [
                    "HTML",
                    "CSS",
                    "JavaScript",
                    "Python"
                ],
                answer: 1
            },

            {
                question: "Which language is used to make webpages interactive?",
                options: [
                    "HTML",
                    "CSS",
                    "JavaScript",
                    "SQL"
                ],
                answer: 2
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function showQuestion() {

            let q = questions[currentQuestion];

            document.getElementById("question").innerHTML = q.question;

            let options = "";

            for (let i = 0; i < q.options.length; i++) {
                options +=
                    '<input type="radio" name="option" value="' + i + '">' +
                    q.options[i] + '<br>';
            }

            document.getElementById("options").innerHTML = options;
        }

        function nextQuestion() {

            let selected = document.querySelector(
                'input[name="option"]:checked'
            );

            if (!selected) {
                alert("Please select an answer");
                return;
            }

            if (Number(selected.value) === questions[currentQuestion].answer) {
                score++;
            }

            currentQuestion++;

            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                document.getElementById("question").innerHTML = "Quiz Completed";
                document.getElementById("options").innerHTML = "";
                document.getElementById("result").innerHTML =
                    "Your Score: " + score + " / " + questions.length;
            }
        }

        showQuestion();

    </script>

</body>
</html>
