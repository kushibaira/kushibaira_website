<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        #display {
            font-size: 45px;
            margin: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Stopwatch</h1>

    <div id="display">00:00:00</div>

    <button onclick="start()">Start</button>
    <button onclick="stop()">Stop</button>
    <button onclick="reset()">Reset</button>

    <script>
        let seconds = 0;
        let timer;

        function start() {
            clearInterval(timer);

            timer = setInterval(function() {
                seconds++;
                displayTime();
            }, 1000);
        }

        function stop() {
            clearInterval(timer);
        }

        function reset() {
            clearInterval(timer);
            seconds = 0;
            displayTime();
        }

        function displayTime() {
            let hrs = Math.floor(seconds / 3600);
            let mins = Math.floor((seconds % 3600) / 60);
            let secs = seconds % 60;

            hrs = String(hrs).padStart(2, "0");
            mins = String(mins).padStart(2, "0");
            secs = String(secs).padStart(2, "0");

            document.getElementById("display").innerHTML =
                hrs + ":" + mins + ":" + secs;
        }
    </script>

</body>
</html>
