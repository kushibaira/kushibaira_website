<!DOCTYPE html>
<html>
<head>
    <title>Skeleton-Loading Component</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background-color: white;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #172554;
            text-align: center;
            margin-bottom: 12px;
        }

        .description {
            color: #64748b;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .skeleton-card {
            padding: 25px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }

        .skeleton {
            background: linear-gradient(
                90deg,
                #e2e8f0 25%,
                #f8fafc 50%,
                #e2e8f0 75%
            );
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 6px;
        }

        .skeleton-image {
            width: 100%;
            height: 180px;
            margin-bottom: 20px;
        }

        .skeleton-title {
            width: 65%;
            height: 24px;
            margin-bottom: 15px;
        }

        .skeleton-text {
            width: 90%;
            height: 14px;
            margin-bottom: 10px;
        }

        .skeleton-text.short {
            width: 70%;
        }

        .skeleton-button {
            width: 120px;
            height: 40px;
            margin-top: 15px;
        }

        @keyframes loading {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 20px;
            }

            .skeleton-image {
                height: 140px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Skeleton-Loading Component</h1>

        <p class="description">
            A skeleton-loading component displays placeholder
            shapes while the actual content is loading.
        </p>

        <div class="skeleton-card">

            <div class="skeleton skeleton-image"></div>

            <div class="skeleton skeleton-title"></div>

            <div class="skeleton skeleton-text"></div>

            <div class="skeleton skeleton-text"></div>

            <div class="skeleton skeleton-text short"></div>

            <div class="skeleton skeleton-button"></div>

        </div>

    </div>

</body>
</html>
