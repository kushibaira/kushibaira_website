<!DOCTYPE html>
<html>
<head>
    <title>Reaction Time Game</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            margin: 10px;
        }

        #box {
            width: 200px;
            height: 100px;
            background-color: lightgray;
            margin: 30px auto;
            padding-top: 50px;
        }
    </style>
</head>
<body>

    <h1>Reaction Time Game</h1>

    <button onclick="startGame()">Start Game</button>

    <div id="box" onclick="checkReaction()">
        Wait...
    </div>

    <p id="result"></p>

    <script>
        let startTime;
        let timer;

        function startGame() {
            document.getElementById("box").textContent =
                "Wait for GO...";

            timer = setTimeout(function() {
                document.getElementById("box").textContent = "GO!";
                startTime = Date.now();
            }, 2000);
        }

        function checkReaction() {
            if (startTime) {
                let reactionTime = Date.now() - startTime;

                document.getElementById("result").textContent =
                    "Your reaction time: " + reactionTime + " ms";

                startTime = null;
            }
        }
    </script>

</body>
</html>
