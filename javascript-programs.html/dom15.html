<!DOCTYPE html>
<html>
<head>
    <title>Delete Selected Row</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        table {
            border-collapse: collapse;
            margin: 25px auto;
            width: 500px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: lightgray;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Delete Selected Row</h1>

    <table id="studentTable">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>Arun</td>
            <td>20</td>
            <td>BCA</td>
            <td><button onclick="deleteRow(this)">Delete</button></td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>21</td>
            <td>BSc</td>
            <td><button onclick="deleteRow(this)">Delete</button></td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>20</td>
            <td>BCom</td>
            <td><button onclick="deleteRow(this)">Delete</button></td>
        </tr>
    </table>

    <script>

        function deleteRow(button) {

            let row = button.parentNode.parentNode;

            row.remove();

        }

    </script>

</body>
</html>
