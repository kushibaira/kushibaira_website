<!DOCTYPE html>
<html>
<head>
    <title>Q64 - Count Words</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 80px;
        }

        textarea {
            width: 400px;
            max-width: 90%;
            height: 100px;
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
        }
    </style>
</head>

<body>

<h1>Count Words</h1>

<textarea
    id="text"
    placeholder="Enter a sentence"
></textarea>

<br>

<button onclick="countWords()">Count Words</button>

<h2 id="result"></h2>

<script>

    function countWords() {

        let text =
            document.getElementById("text").value.trim();

        if (text === "") {

            document.getElementById("result").innerHTML =
                "Number of words = 0";

            return;
        }

        let words =
            text.split(/\s+/);

        document.getElementById("result").innerHTML =
            "Number of words = " + words.length;
    }

</script>

</body>
</html>
