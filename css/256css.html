<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SaaS User Management System</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fa;color:#1f2937}
.wrap{max-width:1100px;margin:auto;padding:25px}
header{display:flex;justify-content:space-between;align-items:center}
.btn{background:#2563eb;color:#fff;border:0;padding:10px 18px;border-radius:7px}
.table{background:#fff;margin-top:25px;border-radius:12px;overflow:auto;box-shadow:0 3px 15px #0001}
table{width:100%;border-collapse:collapse}
th,td{padding:16px;text-align:left;border-bottom:1px solid #eee}
th{background:#f8fafc}
.user{display:flex;gap:10px;align-items:center}
.avatar{width:38px;height:38px;border-radius:50%;background:#dbeafe;display:grid;place-items:center}
.active{color:#16a34a}.admin{color:#7c3aed}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>User Management</h1><p>Manage users and their access.</p></div><button class="btn">Add User</button></header>
<div class="table">
<table>
<tr><th>User</th><th>Role</th><th>Status</th><th>Last Active</th><th>Action</th></tr>
<tr><td><div class="user"><div class="avatar">AS</div>Aarav Sharma</div></td><td class="admin">Admin</td><td class="active">Active</td><td>Today</td><td>⋮</td></tr>
<tr><td><div class="user"><div class="avatar">PR</div>Priya Rao</div></td><td>Editor</td><td class="active">Active</td><td>Yesterday</td><td>⋮</td></tr>
<tr><td><div class="user"><div class="avatar">RK</div>Rahul Kumar</div></td><td>Viewer</td><td>Inactive</td><td>3 days ago</td><td>⋮</td></tr>
</table>
</div>
</div>
</body>
</html>
