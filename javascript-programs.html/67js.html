<!DOCTYPE html>
<html>
<head>
    <title>Q67 - Email Validation</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding: 80px;
        }

        .box {
            background: white;
            width: 450px;
            max-width: 90%;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
        }

        button {
            padding: 10px 25px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Email Validation</h1>

    <input
        type="email"
        id="email"
        placeholder="Enter email address"
    >

    <button onclick="validateEmail()">
        Validate
    </button>

    <p id="result"></p>

</div>

<script>

    function validateEmail() {

        let email =
            document.getElementById("email").value.trim();

        let emailPattern =
            /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

        let result =
            document.getElementById("result");

        if (emailPattern.test(email)) {

            result.innerHTML =
                "Valid Email Address";

        } else {

            result.innerHTML =
                "Invalid Email Address";
        }
    }

</script>

</body>
</html>
