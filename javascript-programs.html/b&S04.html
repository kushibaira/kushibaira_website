<!DOCTYPE html>
<html>
<head>
    <title>History Object</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>History Object</h1>

    <button onclick="goBack()">Go Back</button>
    <button onclick="goForward()">Go Forward</button>
    <button onclick="showHistory()">Show History Length</button>

    <p id="output"></p>

    <script>

        function goBack() {
            window.history.back();
        }

        function goForward() {
            window.history.forward();
        }

        function showHistory() {

            let length = window.history.length;

            document.getElementById("output").innerHTML =
                "Number of pages in history: " + length;
        }

    </script>

</body>
</html>
