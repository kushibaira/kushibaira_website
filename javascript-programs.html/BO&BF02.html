<!DOCTYPE html>
<html>
<head>
    <title>Alert Confirm Prompt</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>JavaScript Dialog Boxes</h1>

    <button onclick="showAlert()">Alert</button>
    <button onclick="showConfirm()">Confirm</button>
    <button onclick="showPrompt()">Prompt</button>

    <div id="output"></div>

    <script>
        function showAlert() {
            alert("This is an alert message!");
        }

        function showConfirm() {
            let result = confirm("Do you want to continue?");

            if (result) {
                document.getElementById("output").innerHTML =
                    "You clicked OK.";
            } else {
                document.getElementById("output").innerHTML =
                    "You clicked Cancel.";
            }
        }

        function showPrompt() {
            let name = prompt("Enter your name:");

            if (name != null) {
                document.getElementById("output").innerHTML =
                    "Hello, " + name + "!";
            }
        }
    </script>

</body>
</html>
