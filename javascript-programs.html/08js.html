<!DOCTYPE html>
<html>
<head>
    <title>Question 8 - Prime Number</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Prime Number Check</h1>

    <input type="number" id="number" placeholder="Enter number">
    <button onclick="checkPrime()">Check</button>

    <h2 id="result"></h2>

    <script>
        function checkPrime() {
            let n = Number(document.getElementById("number").value);
            let prime = true;

            if (n < 2) {
                prime = false;
            }

            for (let i = 2; i <= Math.sqrt(n); i++) {
                if (n % i === 0) {
                    prime = false;
                    break;
                }
            }

            document.getElementById("result").innerHTML =
                prime ? n + " is Prime" : n + " is Not Prime";
        }
    </script>

</body>
</html>
