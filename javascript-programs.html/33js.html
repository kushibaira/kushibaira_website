<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Quiz</h2>

<p>Which keyword declares a constant?</p>

<button onclick="checkAnswer('var')">var</button>
<button onclick="checkAnswer('let')">let</button>
<button onclick="checkAnswer('const')">const</button>
<button onclick="checkAnswer('define')">define</button>

<h3 id="result"></h3>

<script>

function checkAnswer(answer) {

    if (answer === "const") {

        document.getElementById("result")
            .textContent = "Correct Answer!";

    } else {

        document.getElementById("result")
            .textContent = "Wrong Answer!";
    }
}

</script>

</body>
</html>
