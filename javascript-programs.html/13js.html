<!DOCTYPE html>
<html>
<head>
    <title>Question 13 - Sort Array</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Sort Array</h1>

    <input type="text" id="array"
           placeholder="Example: 50,10,30,20,40">

    <button onclick="sortArray()">Sort</button>

    <h2 id="result"></h2>

    <script>
        function sortArray() {
            let arr = document.getElementById("array").value
                .split(",")
                .map(Number);

            arr.sort((a, b) => a - b);

            document.getElementById("result").innerHTML =
                "Sorted Array: " + arr.join(", ");
        }
    </script>

</body>
</html>
