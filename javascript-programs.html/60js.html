<!DOCTYPE html>
<html>
<head>
    <title>Q60 - Common Elements</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 70px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

<h1>Common Elements</h1>

<input
    type="text"
    id="array1"
    placeholder="1,2,3,4"
>

<br>

<input
    type="text"
    id="array2"
    placeholder="3,4,5,6"
>

<br>

<button onclick="findCommon()">Find Common</button>

<h2 id="result"></h2>

<script>

    function findCommon() {

        let a =
            document.getElementById("array1").value
            .split(",")
            .map(Number);

        let b =
            document.getElementById("array2").value
            .split(",")
            .map(Number);

        let common =
            [...new Set(a.filter(value => b.includes(value)))];

        document.getElementById("result").innerHTML =
            common.length > 0
                ? "Common Elements: " + common.join(", ")
                : "No common elements.";
    }

</script>

</body>
</html>
