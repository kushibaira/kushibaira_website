<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Program 51 - SaaS Statistics Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        .navbar {
            background-color: #1e293b;
            padding: 18px 40px;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
        }

        .container h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .container > p {
            text-align: center;
            color: #64748b;
            margin-bottom: 40px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .stat-card {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #dbeafe;
            border-radius: 10px;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .stat-title {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .stat-change {
            font-size: 14px;
            font-weight: bold;
        }

        .positive {
            color: #16a34a;
        }

        .negative {
            color: #dc2626;
        }

        .neutral {
            color: #2563eb;
        }

        @media (max-width: 900px) {
            .stats-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .navbar {
                padding: 15px 20px;
            }

            .container {
                margin: 30px auto;
                padding: 15px;
            }

            .stats-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            CloudFlow
        </div>
    </nav>

    <div class="container">

        <h1>SaaS Statistics</h1>

        <p>
            Overview of important statistics for your SaaS platform.
        </p>

        <div class="stats-container">

            <div class="stat-card">

                <div class="stat-icon">
                    👥
                </div>

                <div class="stat-title">
                    Total Users
                </div>

                <div class="stat-value">
                    12,540
                </div>

                <div class="stat-change positive">
                    ↑ 12.5% this month
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    💰
                </div>

                <div class="stat-title">
                    Monthly Revenue
                </div>

                <div class="stat-value">
                    ₹8.4L
                </div>

                <div class="stat-change positive">
                    ↑ 8.2% this month
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    📊
                </div>

                <div class="stat-title">
                    Active Projects
                </div>

                <div class="stat-value">
                    486
                </div>

                <div class="stat-change neutral">
                    → 3.4% growth
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    ⚡
                </div>

                <div class="stat-title">
                    Churn Rate
                </div>

                <div class="stat-value">
                    2.4%
                </div>

                <div class="stat-change negative">
                    ↓ 0.8% this month
                </div>

            </div>

        </div>

    </div>

</body>

</html>
