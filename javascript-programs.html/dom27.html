<!DOCTYPE html>
<html>
<head>
    <title>Accordion</title>

    <style>
        body {
            font-family: Arial;
            margin: 50px;
        }

        .accordion {
            width: 500px;
            margin: auto;
        }

        .question {
            background-color: lightgray;
            padding: 15px;
            cursor: pointer;
            border: 1px solid black;
        }

        .answer {
            display: none;
            padding: 15px;
            border: 1px solid black;
        }
    </style>
</head>

<body>

    <h1 style="text-align:center;">JavaScript Accordion</h1>

    <div class="accordion">

        <div class="question" onclick="toggleAnswer(this)">
            What is HTML?
        </div>
        <div class="answer">
            HTML is used to create the structure of webpages.
        </div>

        <div class="question" onclick="toggleAnswer(this)">
            What is CSS?
        </div>
        <div class="answer">
            CSS is used to style webpages.
        </div>

        <div class="question" onclick="toggleAnswer(this)">
            What is JavaScript?
        </div>
        <div class="answer">
            JavaScript is used to make webpages interactive.
        </div>

    </div>

    <script>
        function toggleAnswer(question) {

            let answer = question.nextElementSibling;

            if (answer.style.display === "block") {
                answer.style.display = "none";
            } else {
                answer.style.display = "block";
            }
        }
    </script>

</body>
</html>
