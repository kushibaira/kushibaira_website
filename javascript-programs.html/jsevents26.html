<!DOCTYPE html>
<html>
<head>
    <title>Keyboard Controlled Object</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        #gameArea {
            width: 500px;
            height: 300px;
            border: 2px solid black;
            margin: 30px auto;
            position: relative;
        }

        #box {
            width: 40px;
            height: 40px;
            background-color: blue;
            position: absolute;
            left: 0;
            top: 0;
        }
    </style>
</head>
<body>

    <h1>Keyboard Controlled Moving Object</h1>

    <p>Use the arrow keys to move the box.</p>

    <div id="gameArea">
        <div id="box"></div>
    </div>

    <script>
        let box = document.getElementById("box");

        let x = 0;
        let y = 0;

        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowRight") {
                x += 10;
            }

            if (event.key === "ArrowLeft") {
                x -= 10;
            }

            if (event.key === "ArrowDown") {
                y += 10;
            }

            if (event.key === "ArrowUp") {
                y -= 10;
            }

            box.style.left = x + "px";
            box.style.top = y + "px";
        });
    </script>

</body>
</html>
