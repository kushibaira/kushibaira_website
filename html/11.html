<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Internal and External CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            color: blue;
            text-align: center;
        }

        p {
            font-size: 20px;
            color: red;
        }
    </style>

</head>

<body>

    <h1>Internal and External CSS</h1>

    <p>This paragraph uses internal CSS.</p>

    <div class="box">
        This box uses external CSS.
    </div>

</body>

</html>
