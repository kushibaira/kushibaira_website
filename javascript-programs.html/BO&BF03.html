<!DOCTYPE html>
<html>
<head>
    <title>setTimeout</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 10px 20px;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>setTimeout() Demonstration</h1>

    <button onclick="startTimer()">Start</button>

    <div id="message">Click the button.</div>

    <script>
        function startTimer() {
            document.getElementById("message").innerHTML =
                "Wait for 3 seconds...";

            setTimeout(function() {
                document.getElementById("message").innerHTML =
                    "3 seconds completed!";
            }, 3000);
        }
    </script>

</body>
</html>
