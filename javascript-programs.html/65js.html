<!DOCTYPE html>
<html>
<head>
    <title>Q65 - Character Frequency</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 60px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        #result {
            margin-top: 20px;
            line-height: 2;
        }
    </style>
</head>

<body>

<h1>Character Frequency</h1>

<input
    type="text"
    id="text"
    placeholder="Enter text"
>

<button onclick="frequency()">Find</button>

<div id="result"></div>

<script>

    function frequency() {

        let text =
            document.getElementById("text").value;

        let frequency = {};

        for (let char of text) {

            if (char === " ") {
                continue;
            }

            if (frequency[char]) {
                frequency[char]++;
            } else {
                frequency[char] = 1;
            }
        }

        let output = "";

        for (let char in frequency) {

            output +=
                char + " : " + frequency[char] + "<br>";
        }

        document.getElementById("result").innerHTML =
            output;
    }

</script>

</body>
</html>
