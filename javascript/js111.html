<!doctype html>
<title>111. Weather application</title>
<input id="city" value="London"><button id="search">Get weather</button><pre id="result"></pre>
<script>
	search.onclick = async () => {
		result.textContent = "Loading...";
		try {
			const response = await fetch(`https://wttr.in/${encodeURIComponent(city.value)}?format=j1`);
			const data = await response.json();
			result.textContent = `${data.current_condition[0].temp_C}°C, ${data.current_condition[0].weatherDesc[0].value}`;
		} catch { result.textContent = "Weather request failed."; }
	};
</script>
