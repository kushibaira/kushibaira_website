<!DOCTYPE html>
<html>
<head>
    <title>CSS Shadows</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: darkblue;

            /* Text Shadow */
            text-shadow: 3px 3px 5px gray;
        }

        /* Box Shadow */
        .box {
            width: 300px;
            padding: 30px;
            margin: 40px auto;
            background-color: white;

            box-shadow: 5px 5px 15px gray;
        }

        /* Multiple Shadows */
        .card {
            width: 300px;
            padding: 30px;
            margin: 40px auto;
            background-color: lightblue;

            box-shadow:
                0 0 10px blue,
                5px 5px 10px gray;
        }

        .text {
            font-size: 30px;
            color: green;

            /* Text Shadow */
            text-shadow: 2px 2px 4px black;
        }
    </style>
</head>

<body>

    <h1>CSS Box Shadow and Text Shadow</h1>

    <div class="box">
        <h2>Box Shadow</h2>
        <p>
            This box has a shadow around it.
        </p>
    </div>

    <div class="card">
        <h2>Multiple Shadows</h2>
        <p>
            This box contains multiple shadows.
        </p>
    </div>

    <p class="text">
        Text Shadow Example
    </p>

</body>
</html>
