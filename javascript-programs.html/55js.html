<!DOCTYPE html>
<html>
<head>
    <title>Q55 - Count Digits</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 80px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

<h1>Count Digits</h1>

<input type="number" id="number" placeholder="Enter number">

<button onclick="countDigits()">Count</button>

<h2 id="result"></h2>

<script>

    function countDigits() {

        let number =
            document.getElementById("number").value;

        let count =
            Math.abs(Number(number))
                .toString()
                .length;

        document.getElementById("result").innerHTML =
            "Number of digits = " + count;
    }

</script>

</body>
</html>
