<!DOCTYPE html>
<html>
<head>
    <title>Toggle CSS Class</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 60px;
        }

        #text {
            font-size: 24px;
            margin: 30px;
        }

        .highlight {
            color: white;
            background-color: blue;
            padding: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Toggle CSS Class</h1>

    <p id="text">Click the button to toggle the CSS class.</p>

    <button onclick="toggleClass()">Toggle Class</button>

    <script>

        function toggleClass() {
            document.getElementById("text").classList.toggle("highlight");
        }

    </script>

</body>
</html>
