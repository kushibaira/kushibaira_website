<!doctype html>
<title>201. Select box validation</title>
<select id="course"><option value="">Choose course</option><option>Science</option><option>Arts</option></select><button id="check">Validate</button><p id="result"></p>
<script>
	check.onclick = () => result.textContent = course.value ? "Course selected" : "Choose a course";
</script>
