<!DOCTYPE html>
<html>
<head>
    <title>Bar Chart Analytics Component</title>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:Arial,sans-serif; background:#f1f5f9; color:#1e293b; }
        .page { max-width:1100px; margin:auto; padding:30px; }
        header { background:#0f172a; color:white; padding:25px; border-radius:12px; margin-bottom:25px; }
        header h1 { margin-bottom:8px; }
        header p { color:#cbd5e1; }
        .card,.report,.response,.contentcard,.search,.results,.promptbox,.suggestions,.autocomplete,.command,.chat,.form,.donuts,.heatmap,.funnel { background:white; padding:25px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
        .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }
        .card h2 { margin:10px 0; }
        button { border:0; background:#2563eb; color:white; padding:11px 16px; border-radius:7px; cursor:pointer; }
        button:hover { background:#1d4ed8; }
        .funnel { display:flex; flex-direction:column; align-items:center; gap:10px; }
        .stage { color:white; padding:20px; text-align:center; border-radius:8px; }
        .stage span { display:block; margin-top:5px; }
        .s1{background:#1e3a8a;width:100%} .s2{background:#2563eb;width:80%} .s3{background:#3b82f6;width:60%} .s4{background:#60a5fa;width:40%}
        .chart { height:280px; display:flex; align-items:flex-end; gap:12px; padding:20px; border-left:1px solid #cbd5e1; border-bottom:1px solid #cbd5e1; }
        
        .chart span { flex:1; background:#2563eb; border-radius:6px 6px 0 0; }
        .legend { display:flex; gap:10px; justify-content:space-between; margin-top:10px; color:#64748b; font-size:11px; }
        
        @media(max-width:800px) { .grid{grid-template-columns:repeat(2,1fr)} .donuts{flex-direction:column} }
        @media(max-width:550px) { .page{padding:15px} .grid{grid-template-columns:1fr} .chart{gap:5px} }
    </style>
</head>
<body>
    <main class="page">
        <header>
            <h1>Bar Chart Analytics Component</h1>
            <p>A bar-chart analytics component for comparing categories.</p>
        </header>
        
        <div class="chart">
            <span style="height:35%"></span><span style="height:48%"></span>
            <span style="height:43%"></span><span style="height:61%"></span>
            <span style="height:55%"></span><span style="height:74%"></span>
            <span style="height:68%"></span><span style="height:88%"></span>
            <span style="height:80%"></span><span style="height:100%"></span>
        </div>
        <div class="legend"><b>Jan</b><b>Feb</b><b>Mar</b><b>Apr</b><b>May</b><b>Jun</b><b>Jul</b><b>Aug</b><b>Sep</b><b>Oct</b></div>
    </main>
</body>
</html>
