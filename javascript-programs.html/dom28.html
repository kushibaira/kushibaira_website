<!DOCTYPE html>
<html>
<head>
    <title>Modal Popup</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-box {
            background-color: white;
            width: 350px;
            margin: 150px auto;
            padding: 25px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>Modal Popup</h1>

    <button onclick="openModal()">Open Popup</button>

    <div id="modal">

        <div class="modal-box">
            <h2>Hello!</h2>
            <p>This is a modal popup.</p>

            <button onclick="closeModal()">Close</button>
        </div>

    </div>

    <script>
        function openModal() {
            document.getElementById("modal").style.display = "block";
        }

        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }
    </script>

</body>
</html>
