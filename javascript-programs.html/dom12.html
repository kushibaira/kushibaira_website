<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Ordered List</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 60px;
        }

        input {
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        ol {
            width: 300px;
            margin: 20px auto;
            text-align: left;
        }

        li {
            padding: 6px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Dynamic Ordered List</h1>

    <input type="text" id="itemInput" placeholder="Enter an item">

    <button onclick="addItem()">Add Item</button>

    <ol id="itemList"></ol>

    <script>

        function addItem() {

            let input = document.getElementById("itemInput");
            let value = input.value;

            if (value !== "") {

                let item = document.createElement("li");

                item.textContent = value;

                document.getElementById("itemList").appendChild(item);

                input.value = "";
            }
        }

    </script>

</body>
</html>
