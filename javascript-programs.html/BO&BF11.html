<!DOCTYPE html>
<html>
<head>
    <title>History Object</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 70px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>History Object</h1>

    <button onclick="goBack()">Back</button>
    <button onclick="goForward()">Forward</button>

    <div id="output"></div>

    <script>
        function goBack() {
            history.back();
        }

        function goForward() {
            history.forward();
        }
    </script>

</body>
</html>
