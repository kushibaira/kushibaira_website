<!DOCTYPE html>
<html>
<head>
    <title>Tic-Tac-Toe Game</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            gap: 5px;
            justify-content: center;
            margin: 20px auto;
        }

        .cell {
            width: 80px;
            height: 80px;
            font-size: 30px;
            cursor: pointer;
        }

        #message {
            font-size: 20px;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Tic-Tac-Toe</h1>

    <div class="board">
        <button class="cell" onclick="makeMove(0)"></button>
        <button class="cell" onclick="makeMove(1)"></button>
        <button class="cell" onclick="makeMove(2)"></button>

        <button class="cell" onclick="makeMove(3)"></button>
        <button class="cell" onclick="makeMove(4)"></button>
        <button class="cell" onclick="makeMove(5)"></button>

        <button class="cell" onclick="makeMove(6)"></button>
        <button class="cell" onclick="makeMove(7)"></button>
        <button class="cell" onclick="makeMove(8)"></button>
    </div>

    <p id="message">Player X's Turn</p>

    <button onclick="resetGame()">Reset Game</button>

    <script>

        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let gameOver = false;

        let winningCombinations = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function makeMove(index) {

            if (board[index] !== "" || gameOver) {
                return;
            }

            board[index] = currentPlayer;

            document.getElementsByClassName("cell")[index].innerHTML =
                currentPlayer;

            checkWinner();
        }

        function checkWinner() {

            for (let combination of winningCombinations) {

                let a = combination[0];
                let b = combination[1];
                let c = combination[2];

                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[a] === board[c]
                ) {
                    document.getElementById("message").innerHTML =
                        "Player " + currentPlayer + " Wins!";

                    gameOver = true;
                    return;
                }
            }

            if (!board.includes("")) {
                document.getElementById("message").innerHTML =
                    "It's a Draw!";
                gameOver = true;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";

            document.getElementById("message").innerHTML =
                "Player " + currentPlayer + "'s Turn";
        }

        function resetGame() {

            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            gameOver = false;

            let cells = document.getElementsByClassName("cell");

            for (let cell of cells) {
                cell.innerHTML = "";
            }

            document.getElementById("message").innerHTML =
                "Player X's Turn";
        }

    </script>

</body>
</html>
