<!DOCTYPE html>
<html>
<head>
    <title>Change CSS Styles Using JavaScript</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        #box {
            width: 200px;
            padding: 30px;
            margin: 20px auto;
            background-color: lightblue;
            font-size: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>DOM Manipulation</h1>

    <h2>Change CSS Styles Using JavaScript</h2>

    <div id="box">
        Change My Style
    </div>

    <button onclick="changeStyle()">
        Change Style
    </button>

    <script>
        function changeStyle() {

            // Select the element
            let box = document.getElementById("box");

            // Change CSS styles using JavaScript
            box.style.backgroundColor = "lightgreen";
            box.style.color = "red";
            box.style.fontSize = "25px";
            box.style.border = "3px solid black";
        }
    </script>

</body>
</html>
