<!DOCTYPE html>
<html>
<head>
    <title>addEventListener</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 12px 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>addEventListener()</h1>

    <button id="btn">Click Me</button>

    <p id="message"></p>

    <script>
        document.getElementById("btn").addEventListener("click", function() {
            document.getElementById("message").textContent =
                "Button clicked!";
        });
    </script>

</body>
</html>
