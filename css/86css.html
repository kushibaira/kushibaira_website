<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .contact-container {
            width: 90%;
            max-width: 800px;
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        .submit-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-button:hover {
            background-color: #1d4ed8;
        }

        .contact-info {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e2e8f0;
        }

        .info-box {
            flex: 1;
            text-align: center;
            padding: 15px;
            background-color: #f8fafc;
            border-radius: 8px;
        }

        .info-box strong {
            display: block;
            color: #334155;
            margin-bottom: 5px;
        }

        .info-box span {
            color: #64748b;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .contact-container {
                padding: 30px 22px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .contact-info {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="contact-container">

        <h1>Contact Us</h1>

        <p class="description">
            Have a question or need assistance?
            Fill out the form below and we will get back to you.
        </p>

        <form>

            <div class="form-row">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                    >
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>

                    <select id="subject" required>
                        <option value="">Select a subject</option>
                        <option value="general">General Inquiry</option>
                        <option value="support">Technical Support</option>
                        <option value="feedback">Feedback</option>
                        <option value="other">Other</option>
                    </select>
                </div>

            </div>

            <div class="form-group">

                <label for="message">Message</label>

                <textarea
                    id="message"
                    placeholder="Write your message here..."
                    required
                ></textarea>

            </div>

            <button type="submit" class="submit-button">
                Send Message
            </button>

        </form>

        <div class="contact-info">

            <div class="info-box">
                <strong>Email</strong>
                <span>support@example.com</span>
            </div>

            <div class="info-box">
                <strong>Phone</strong>
                <span>+91 98765 43210</span>
            </div>

            <div class="info-box">
                <strong>Office</strong>
                <span>Chennai, India</span>
            </div>

        </div>

    </div>

</body>
</html>
