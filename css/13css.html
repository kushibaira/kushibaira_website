<!DOCTYPE html>
<html>
<head>
    <title>CSS Display Properties</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        /* Block Display */
        .block {
            display: block;
            background-color: lightblue;
            padding: 15px;
            margin: 10px;
        }

        /* Inline Display */
        .inline {
            display: inline;
            background-color: lightgreen;
            padding: 10px;
        }

        /* Inline-Block Display */
        .inline-block {
            display: inline-block;
            background-color: lightyellow;
            width: 150px;
            padding: 20px;
            margin: 10px;
        }

        /* Flex Display */
        .flex-container {
            display: flex;
            gap: 10px;
            background-color: lightgray;
            padding: 15px;
        }

        .flex-item {
            background-color: orange;
            padding: 20px;
        }

        /* None Display */
        .none {
            display: none;
        }
    </style>
</head>

<body>

    <h1>CSS Display Properties</h1>

    <h2>Block Display</h2>

    <div class="block">Block Element 1</div>
    <div class="block">Block Element 2</div>

    <h2>Inline Display</h2>

    <span class="inline">Inline Element 1</span>
    <span class="inline">Inline Element 2</span>

    <h2>Inline-Block Display</h2>

    <div class="inline-block">Box 1</div>
    <div class="inline-block">Box 2</div>

    <h2>Flex Display</h2>

    <div class="flex-container">
        <div class="flex-item">Item 1</div>
        <div class="flex-item">Item 2</div>
        <div class="flex-item">Item 3</div>
    </div>

    <h2 class="none">
        This heading is hidden.
    </h2>

</body>
</html>
