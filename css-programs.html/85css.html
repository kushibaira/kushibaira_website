<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .registration-container {
            width: 90%;
            max-width: 650px;
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .gender-options {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .gender-option {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #64748b;
            font-weight: normal;
        }

        .gender-option input {
            width: auto;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 5px 0 25px;
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
        }

        .terms input {
            width: auto;
            margin-top: 3px;
        }

        .terms a {
            color: #2563eb;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .register-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-button:hover {
            background-color: #1d4ed8;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 14px;
        }

        .login a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .login a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .registration-container {
                padding: 30px 22px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .gender-options {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="registration-container">

        <h1>Registration Form</h1>

        <p class="description">
            Create your account by filling in the registration details below.
        </p>

        <form>

            <div class="form-row">

                <div class="form-group">
                    <label for="first-name">First Name</label>

                    <input
                        type="text"
                        id="first-name"
                        placeholder="Enter first name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="last-name">Last Name</label>

                    <input
                        type="text"
                        id="last-name"
                        placeholder="Enter last name"
                        required
                    >
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email address"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        required
                    >
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm password"
                        required
                    >
                </div>

            </div>

            <div class="form-group">

                <label for="country">Country</label>

                <select id="country" required>
                    <option value="">Select your country</option>
                    <option value="india">India</option>
                    <option value="usa">United States</option>
                    <option value="uk">United Kingdom</option>
                    <option value="canada">Canada</option>
                    <option value="australia">Australia</option>
                </select>

            </div>

            <div class="form-group">

                <label>Gender</label>

                <div class="gender-options">

                    <label class="gender-option">
                        <input type="radio" name="gender" value="male">
                        Male
                    </label>

                    <label class="gender-option">
                        <input type="radio" name="gender" value="female">
                        Female
                    </label>

                    <label class="gender-option">
                        <input type="radio" name="gender" value="other">
                        Other
                    </label>

                </div>

            </div>

            <div class="form-group">

                <label for="address">Address</label>

                <textarea
                    id="address"
                    placeholder="Enter your address"
                ></textarea>

            </div>

            <label class="terms">

                <input type="checkbox" required>

                <span>
                    I agree to the
                    <a href="#">Terms and Conditions</a>
                    and
                    <a href="#">Privacy Policy</a>.
                </span>

            </label>

            <button type="submit" class="register-button">
                Register
            </button>

        </form>

        <div class="login">
            Already have an account?
            <a href="#">Login</a>
        </div>

    </div>

</body>
</html>
