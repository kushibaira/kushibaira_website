<!DOCTYPE html>
<html>
<head>
    <title>Question 11 - Sum of Digits</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Sum of Digits</h1>

    <input type="number" id="number" placeholder="Enter number">
    <button onclick="sumDigits()">Calculate</button>

    <h2 id="result"></h2>

    <script>
        function sumDigits() {
            let num = Math.abs(
                Number(document.getElementById("number").value)
            );

            let sum = 0;

            while (num > 0) {
                sum += num % 10;
                num = Math.floor(num / 10);
            }

            document.getElementById("result").innerHTML =
                "Sum of digits = " + sum;
        }
    </script>

</body>
</html>
