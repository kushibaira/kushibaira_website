<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .gallery {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .gallery-item {
            height: 220px;
            overflow: hidden;
            border-radius: 12px;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 650px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 400px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Media Gallery</h1>

    <div class="gallery">

        <div class="gallery-item">
            <img src="https://picsum.photos/500/400?random=1" alt="Gallery Image">
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/500/400?random=2" alt="Gallery Image">
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/500/400?random=3" alt="Gallery Image">
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/500/400?random=4" alt="Gallery Image">
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/500/400?random=5" alt="Gallery Image">
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/500/400?random=6" alt="Gallery Image">
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/500/400?random=7" alt="Gallery Image">
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/500/400?random=8" alt="Gallery Image">
        </div>

    </div>

</body>
</html>
