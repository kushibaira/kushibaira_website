<!DOCTYPE html>
<html>
<head>
    <title>Ondblclick Event</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>Demonstration of Ondblclick Event</h1>

    <button ondblclick="showMessage()">Double Click Me</button>

    <p id="message"></p>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Button was double-clicked!";
        }
    </script>

</body>
</html>
