<!DOCTYPE html>
<html>
<head>
    <title>Remove HTML Element Dynamically</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        #container {
            margin-top: 20px;
        }

        p {
            color: blue;
            font-size: 18px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>DOM Manipulation</h1>

    <h2>Remove HTML Element Dynamically</h2>

    <div id="container">
        <p id="text">This paragraph will be removed.</p>
    </div>

    <button onclick="removeElement()">
        Remove Element
    </button>

    <script>
        function removeElement() {

            // Get the element
            let element = document.getElementById("text");

            // Remove the element
            element.remove();
        }
    </script>

</body>
</html>
