<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Complete SaaS Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f6f8fc;color:#1e293b}
.layout{display:flex;min-height:100vh}
aside{width:230px;background:#111827;color:white;padding:25px;position:fixed;height:100vh}
aside h2{margin-top:0}
nav a{display:block;color:#cbd5e1;text-decoration:none;padding:12px;border-radius:7px;margin:5px 0}
nav a:hover{background:#1f2937;color:white}
main{margin-left:230px;width:calc(100% - 230px);padding:30px}
.top{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:25px 0}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 3px 15px #0001}
.value{font-size:28px;font-weight:bold;margin-top:10px}
.content{display:grid;grid-template-columns:2fr 1fr;gap:20px}
.chart{height:280px;display:flex;align-items:end;gap:12px}
.bar{flex:1;background:#2563eb;border-radius:5px 5px 0 0}
.activity li{padding:12px 0;border-bottom:1px solid #eee}
@media(max-width:800px){
aside{width:70px;padding:15px}
aside h2{font-size:0}
aside h2:after{content:"CF";font-size:18px}
nav a{font-size:0}
main{margin-left:70px;width:calc(100% - 70px)}
.grid{grid-template-columns:repeat(2,1fr)}
.content{grid-template-columns:1fr}
}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
<aside>
<h2>CloudFlow</h2>
<nav>
<a href="#">🏠 Dashboard</a>
<a href="#">📊 Analytics</a>
<a href="#">👥 Users</a>
<a href="#">⚙ Settings</a>
</nav>
</aside>
<main>
<div class="top">
<div><h1>Dashboard</h1><p>Welcome back! Here's your overview.</p></div>
<button>Export</button>
</div>
<div class="grid">
<div class="card">Revenue<div class="value">$48,240</div></div>
<div class="card">Users<div class="value">12,840</div></div>
<div class="card">Orders<div class="value">3,420</div></div>
<div class="card">Growth<div class="value">18.6%</div></div>
</div>
<div class="content">
<div class="card">
<h2>Monthly Revenue</h2>
<div class="chart">
<div class="bar" style="height:45%"></div>
<div class="bar" style="height:60%"></div>
<div class="bar" style="height:52%"></div>
<div class="bar" style="height:75%"></div>
<div class="bar" style="height:68%"></div>
<div class="bar" style="height:90%"></div>
<div class="bar" style="height:82%"></div>
</div>
</div>
<div class="card">
<h2>Recent Activity</h2>
<ul class="activity">
<li>New user registered</li>
<li>Payment received</li>
<li>Report generated</li>
<li>Team member invited</li>
</ul>
</div>
</div>
</main>
</div>
</body>
</html>
