<!doctype html>
<title>35. Stopwatch</title>
<output id="display">0</output>
<button onclick="start()">Start</button>
<button onclick="clearInterval(timer)">Stop</button>
<button onclick="clearInterval(timer);
seconds=0;
display.value=0">Reset</button>
<script>let seconds=0,timer;
function start(){clearInterval(timer);
timer=setInterval(()=>display.value=++seconds,1000)}</script>
