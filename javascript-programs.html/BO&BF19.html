<!DOCTYPE html>
<html>
<head>
    <title>Geographical Coordinates</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 70px;
        }

        button {
            padding: 12px 20px;
        }

        #coordinates {
            margin-top: 25px;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>Current Geographical Coordinates</h1>

    <button onclick="showCoordinates()">Get Coordinates</button>

    <div id="coordinates"></div>

    <script>
        function showCoordinates() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {

                        let latitude = position.coords.latitude;
                        let longitude = position.coords.longitude;

                        document.getElementById("coordinates").innerHTML =
                            "Latitude: " + latitude + "<br>" +
                            "Longitude: " + longitude;
                    },
                    function() {
                        document.getElementById("coordinates").innerHTML =
                            "Unable to get location.";
                    }
                );
            } else {
                document.getElementById("coordinates").innerHTML =
                    "Geolocation is not supported by this browser.";
            }
        }
    </script>

</body>
</html>
