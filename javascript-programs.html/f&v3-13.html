<!DOCTYPE html>
<html>
<head>
    <title>Checkbox Validation</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>Checkbox Validation</h1>

    <input type="checkbox" id="terms">
    I agree to the terms and conditions.

    <br>

    <button onclick="validateCheckbox()">Submit</button>

    <p id="message"></p>

    <script>
        function validateCheckbox() {
            let checkbox = document.getElementById("terms");

            if (checkbox.checked) {
                document.getElementById("message").textContent =
                    "Checkbox selected.";
            } else {
                document.getElementById("message").textContent =
                    "Please select the checkbox.";
            }
        }
    </script>

</body>
</html>
