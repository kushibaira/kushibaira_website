<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Model Metrics</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b}
.page{max-width:1100px;margin:auto;padding:30px}
header{background:#0f172a;color:white;padding:25px;border-radius:12px;margin-bottom:25px}
header h1{font-size:27px;margin-bottom:8px}
header p{color:#cbd5e1;line-height:1.5}
.panel,.card,.tablebox,.workflow,.settings,.alert,.metric,.profile{
background:white;padding:24px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card h3{margin-bottom:10px}.card p{color:#64748b;line-height:1.5}
button{border:0;background:#2563eb;color:white;padding:11px 16px;border-radius:7px;cursor:pointer}
button:hover{background:#1d4ed8}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px}
label{display:grid;gap:7px;font-weight:bold}
.form{display:grid;gap:17px}
.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#dbeafe;color:#1d4ed8;font-size:13px}
.success{color:#16a34a;font-weight:bold}.warning{color:#d97706;font-weight:bold}.danger{color:#dc2626;font-weight:bold}
.muted{color:#64748b}
.progress{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:#2563eb;border-radius:10px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:13px;border-bottom:1px solid #e2e8f0}
th{color:#475569}
.bar-chart{height:250px;display:flex;align-items:flex-end;gap:14px;border-left:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1;padding:20px}
.bar-chart span{flex:1;background:#2563eb;border-radius:5px 5px 0 0}
.timeline{display:grid;gap:14px}
.step{padding:18px;border-left:4px solid #2563eb;background:white;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:550px){.page{padding:15px}.grid{grid-template-columns:1fr}header h1{font-size:22px}}
</style>
</head>
<body>
<main class="page">
<header>
<h1>CSS 176 — ML Model Metrics</h1>
<p>Practical implementation of ml model metrics using HTML and CSS.</p>
</header>
<div class="grid"><div class="card"><h3>Accuracy</h3><h2>94.6%</h2></div><div class="card"><h3>Precision</h3><h2>92.1%</h2></div><div class="card"><h3>Recall</h3><h2>90.8%</h2></div><div class="card"><h3>F1 Score</h3><h2>91.4%</h2></div><div class="card"><h3>MAE</h3><h2>0.084</h2></div><div class="card"><h3>RMSE</h3><h2>0.126</h2></div></div>
</main>
</body>
</html>
