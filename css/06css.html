<!DOCTYPE html>
<html>
<head>
    <title>CSS Border Properties</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        /* Solid Border */
        .solid {
            border-style: solid;
            border-width: 3px;
            border-color: red;
            padding: 20px;
            margin: 15px;
        }

        /* Dashed Border */
        .dashed {
            border: 3px dashed green;
            padding: 20px;
            margin: 15px;
        }

        /* Dotted Border */
        .dotted {
            border: 4px dotted blue;
            padding: 20px;
            margin: 15px;
        }

        /* Double Border */
        .double {
            border: 5px double purple;
            padding: 20px;
            margin: 15px;
        }

        /* Rounded Border */
        .rounded {
            border: 3px solid orange;
            border-radius: 20px;
            padding: 20px;
            margin: 15px;
        }

        /* Circle */
        .circle {
            width: 150px;
            height: 150px;
            border: 4px solid brown;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
        }

    </style>
</head>

<body>

    <h1>CSS Border Properties</h1>

    <div class="solid">
        Solid Border
    </div>

    <div class="dashed">
        Dashed Border
    </div>

    <div class="dotted">
        Dotted Border
    </div>

    <div class="double">
        Double Border
    </div>

    <div class="rounded">
        Rounded Border
    </div>

    <div class="circle">
        Circle
    </div>

</body>
</html>
