<!DOCTYPE html>
<html>
<head>
    <title>Reset Password Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .reset-container {
            width: 90%;
            max-width: 440px;
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background-color: #dbeafe;
            color: #2563eb;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 12px;
        }

        .description {
            text-align: center;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        .password-info {
            margin-top: 7px;
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.5;
        }

        .reset-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-button:hover {
            background-color: #1d4ed8;
        }

        .back-login {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 20px;
            padding: 14px;
            background-color: #f8fafc;
            border-radius: 8px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 500px) {
            .reset-container {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="reset-container">

        <div class="icon">
            🔒
        </div>

        <h1>Reset Password</h1>

        <p class="description">
            Create a new password for your account.
            Make sure it is strong and secure.
        </p>

        <form>

            <div class="form-group">
                <label for="password">New Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter new password"
                    required
                >

                <p class="password-info">
                    Use at least 8 characters with a combination
                    of letters, numbers, and symbols.
                </p>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm New Password</label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm new password"
                    required
                >
            </div>

            <button type="submit" class="reset-button">
                Reset Password
            </button>

        </form>

        <div class="security-note">
            Your password will be securely updated after
            submitting this form.
        </div>

        <a href="#" class="back-login">
            ← Back to Login
        </a>

    </div>

</body>
</html>
