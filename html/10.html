<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>College Timetable</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 15px;
        }

        th {
            background-color: lightblue;
        }

        td {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>College Timetable</h1>

    <table>

        <tr>
            <th>Day</th>
            <th>9:00 - 10:00</th>
            <th>10:00 - 11:00</th>
            <th>11:00 - 12:00</th>
            <th>12:00 - 1:00</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>Python</td>
            <td>Maths</td>
            <td>DSA</td>
            <td>Break</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>Java</td>
            <td>English</td>
            <td>DBMS</td>
            <td>Break</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>Maths</td>
            <td>Python</td>
            <td>Web Development</td>
            <td>Break</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td>DSA</td>
            <td>Java</td>
            <td>Maths</td>
            <td>Break</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>DBMS</td>
            <td>Python</td>
            <td>English</td>
            <td>Break</td>
        </tr>

    </table>

</body>
</html>
