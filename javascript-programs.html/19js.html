<!DOCTYPE html>
<html>
<head>
    <title>Question 19 - Objects</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }
        button {
            padding: 10px 20px;
        }
        #result {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>JavaScript Object</h1>

    <button onclick="displayObject()">Display Student</button>

    <div id="result"></div>

    <script>
        const student = {
            name: "Rahul",
            age: 20,
            course: "JavaScript"
        };

        function displayObject() {
            document.getElementById("result").innerHTML =
                "Name: " + student.name + "<br>" +
                "Age: " + student.age + "<br>" +
                "Course: " + student.course;
        }
    </script>

</body>
</html>
