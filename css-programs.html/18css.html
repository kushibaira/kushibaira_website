<!DOCTYPE html>
<html>
<head>
    <title>CSS Variables</title>

    <style>
        /* Declaring CSS Variables */
        :root {
            --main-color: darkblue;
            --secondary-color: lightblue;
            --text-color: white;
            --padding-size: 20px;
            --border-radius: 10px;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: var(--main-color);
        }

        .header {
            background-color: var(--main-color);
            color: var(--text-color);
            padding: var(--padding-size);
            text-align: center;
        }

        .card {
            background-color: var(--secondary-color);
            padding: var(--padding-size);
            margin: 30px auto;
            width: 300px;
            border-radius: var(--border-radius);
            color: var(--main-color);
        }

        .button {
            background-color: var(--main-color);
            color: var(--text-color);
            padding: 10px 20px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
        }

        .button:hover {
            background-color: green;
        }
    </style>
</head>

<body>

    <h1>CSS Variables</h1>

    <div class="header">
        <h2>Welcome to My Website</h2>
    </div>

    <div class="card">
        <h2>Student Card</h2>

        <p>
            This card uses CSS custom properties.
        </p>

        <button class="button">
            Click Me
        </button>
    </div>

</body>
</html>
