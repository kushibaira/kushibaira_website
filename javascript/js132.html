<!doctype html>
<title>132. Change attributes</title>
<img id="image" width="240" alt="First image" src="https://picsum.photos/id/1015/240/140">
<button id="button">Change attributes</button>
<script>
	button.onclick = () => {
		image.setAttribute("alt", "Updated image");
		image.setAttribute("src", "https://picsum.photos/id/1025/240/140");
	};
</script>
