<!DOCTYPE html>
<html>
<head>
    <title>Object in localStorage</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 60px;
        }

        button {
            padding: 10px 20px;
        }

        #output {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Store JavaScript Object</h1>

    <button onclick="storeObject()">Store Object</button>

    <div id="output"></div>

    <script>
        function storeObject() {
            let student = {
                name: "John",
                age: 20,
                course: "Computer Science"
            };

            localStorage.setItem(
                "student",
                JSON.stringify(student)
            );

            let data = JSON.parse(
                localStorage.getItem("student")
            );

            document.getElementById("output").innerHTML =
                "Name: " + data.name + "<br>" +
                "Age: " + data.age + "<br>" +
                "Course: " + data.course;
        }
    </script>

</body>
</html>
