<!DOCTYPE html>
<html>
<head>
    <title>Q62 - String Palindrome</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 80px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

<h1>String Palindrome</h1>

<input
    type="text"
    id="text"
    placeholder="Enter string"
>

<button onclick="checkPalindrome()">Check</button>

<h2 id="result"></h2>

<script>

    function checkPalindrome() {

        let text =
            document.getElementById("text").value
            .toLowerCase()
            .replace(/[^a-z0-9]/g, "");

        let reversed =
            text.split("").reverse().join("");

        document.getElementById("result").innerHTML =
            text === reversed
                ? "Palindrome"
                : "Not a Palindrome";
    }

</script>

</body>
</html>
