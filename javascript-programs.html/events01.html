<!DOCTYPE html>
<html>
<head>
    <title>Mouse Events</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        #box {
            width: 250px;
            height: 150px;
            margin: 30px auto;
            background-color: lightblue;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Events</h1>

    <h2>Mouse Events</h2>

    <div id="box">
        Move or Click the Mouse Here
    </div>

    <p id="message">Mouse event will be displayed here.</p>

    <script>
        let box = document.getElementById("box");
        let message = document.getElementById("message");

        // Mouse click event
        box.addEventListener("click", function() {
            message.textContent = "Mouse Clicked!";
        });

        // Mouse over event
        box.addEventListener("mouseover", function() {
            message.textContent = "Mouse is over the box!";
        });

        // Mouse out event
        box.addEventListener("mouseout", function() {
            message.textContent = "Mouse left the box!";
        });

        // Mouse down event
        box.addEventListener("mousedown", function() {
            message.textContent = "Mouse button pressed!";
        });

        // Mouse up event
        box.addEventListener("mouseup", function() {
            message.textContent = "Mouse button released!";
        });
    </script>

</body>
</html>
