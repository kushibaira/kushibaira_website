<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Semantic HTML</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background-color: navy;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: lightgray;
            padding: 15px;
            text-align: center;
        }

        nav a {
            margin: 15px;
            text-decoration: none;
        }

        section {
            padding: 20px;
        }

        article {
            background-color: #f2f2f2;
            padding: 15px;
            margin-top: 10px;
        }

        footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My College Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
    </nav>

    <section>
        <h2>Welcome to Our College</h2>

        <article>
            <h3>About College</h3>
            <p>
                Our college provides quality education
                and practical learning opportunities.
            </p>
        </article>

        <article>
            <h3>Courses Offered</h3>
            <p>
                B.Tech, B.Sc, B.Com and other courses.
            </p>
        </article>
    </section>

    <footer>
        <p>© 2026 My College</p>
    </footer>

</body>
</html>
