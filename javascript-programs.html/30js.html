<!DOCTYPE html>
<html>
<body>

<h2>Form Validation</h2>

<form onsubmit="return validateForm()">

<input
    type="text"
    id="name"
    placeholder="Name"
>

<br><br>

<input
    type="email"
    id="email"
    placeholder="Email"
>

<br><br>

<button type="submit">
    Submit
</button>

</form>

<p id="message"></p>

<script>

function validateForm() {

    let name =
        document.getElementById("name").value.trim();

    let email =
        document.getElementById("email").value.trim();

    if (name === "" || email === "") {

        document.getElementById("message")
            .textContent = "All fields are required.";

        return false;
    }

    document.getElementById("message")
        .textContent = "Form submitted successfully.";

    return false;
}

</script>

</body>
</html>
