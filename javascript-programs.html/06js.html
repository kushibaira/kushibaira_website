<!DOCTYPE html>
<html>
<head>
    <title>Question 6 - Factorial</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Factorial</h1>

    <input type="number" id="number" placeholder="Enter number">
    <button onclick="factorial()">Calculate</button>

    <h2 id="result"></h2>

    <script>
        function factorial() {
            let n = Number(document.getElementById("number").value);
            let fact = 1;

            for (let i = 1; i <= n; i++) {
                fact *= i;
            }

            document.getElementById("result").innerHTML =
                "Factorial = " + fact;
        }
    </script>

</body>
</html>
