<!DOCTYPE html>
<html>
<head>
    <title>Loading-State Component</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background-color: white;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            color: #172554;
            margin-bottom: 12px;
        }

        .description {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .loading-state {
            padding: 45px 25px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }

        .spinner {
            width: 65px;
            height: 65px;
            margin: 0 auto 25px;
            border: 6px solid #dbeafe;
            border-top: 6px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .loading-state h2 {
            color: #334155;
            margin-bottom: 12px;
        }

        .loading-state p {
            max-width: 500px;
            margin: 0 auto;
            color: #64748b;
            line-height: 1.6;
        }

        .loading-dots {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 7px;
        }

        .loading-dots span {
            width: 10px;
            height: 10px;
            background-color: #2563eb;
            border-radius: 50%;
            animation: dots 1.2s infinite ease-in-out;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dots {
            0%, 80%, 100% {
                transform: scale(0.7);
                opacity: 0.5;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 20px;
            }

            .loading-state {
                padding: 35px 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Loading-State Component</h1>

        <p class="description">
            A loading-state component informs users that content
            or an operation is currently being processed.
        </p>

        <div class="loading-state">

            <div class="spinner"></div>

            <h2>Loading...</h2>

            <p>
                Please wait while we process your request.
                This may take a few moments.
            </p>

            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    </div>

</body>
</html>
