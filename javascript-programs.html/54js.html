<!DOCTYPE html>
<html>
<head>
    <title>Q54 - Power</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 80px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

<h1>Power of a Number</h1>

<input type="number" id="base" placeholder="Base">

<input type="number" id="exponent" placeholder="Exponent">

<br>

<button onclick="calculatePower()">Calculate</button>

<h2 id="result"></h2>

<script>

    function calculatePower() {

        let base =
            Number(document.getElementById("base").value);

        let exponent =
            Number(document.getElementById("exponent").value);

        let result =
            Math.pow(base, exponent);

        document.getElementById("result").innerHTML =
            base + " ^ " + exponent + " = " + result;
    }

</script>

</body>
</html>
