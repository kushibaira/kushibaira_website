<!DOCTYPE html>
<html>
<head>
    <title>Mouse Coordinate Tracker</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        #area {
            width: 500px;
            height: 250px;
            background-color: lightgray;
            margin: auto;
        }

        #coordinates {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>Mouse Coordinate Tracker</h1>

    <div id="area"></div>

    <p id="coordinates">Move the mouse inside the box.</p>

    <script>
        document.getElementById("area").addEventListener("mousemove", function(event) {
            document.getElementById("coordinates").textContent =
                "X: " + event.offsetX +
                " | Y: " + event.offsetY;
        });
    </script>

</body>
</html>
