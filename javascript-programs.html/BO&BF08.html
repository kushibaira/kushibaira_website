<!DOCTYPE html>
<html>
<head>
    <title>Location Object</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 10px 20px;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Location Object</h1>

    <button onclick="showLocation()">Show Location</button>

    <div id="output"></div>

    <script>
        function showLocation() {
            document.getElementById("output").innerHTML =
                "Current URL: " + location.href + "<br>" +
                "Hostname: " + location.hostname + "<br>" +
                "Protocol: " + location.protocol;
        }
    </script>

</body>
</html>
