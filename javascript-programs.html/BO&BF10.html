<!DOCTYPE html>
<html>
<head>
    <title>Current URL</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        #url {
            margin-top: 20px;
            font-size: 20px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h1>Current Webpage URL</h1>

    <button onclick="showURL()">Show URL</button>

    <div id="url"></div>

    <script>
        function showURL() {
            document.getElementById("url").innerHTML =
                window.location.href;
        }
    </script>

</body>
</html>
