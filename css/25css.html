<!DOCTYPE html>
<html>
<head>
    <title>CSS Outline Property</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .box {
            width: 300px;
            padding: 20px;
            margin: 30px auto;
            background-color: lightyellow;

            /* Border */
            border: 3px solid green;

            /* Outline */
            outline: 5px dashed red;
            outline-offset: 10px;
        }

        .input-box {
            display: block;
            width: 300px;
            padding: 12px;
            margin: 40px auto;

            border: 2px solid gray;
            outline: 3px solid blue;
            outline-offset: 5px;
        }
    </style>
</head>

<body>

    <h1>CSS Outline Property</h1>

    <div class="box">
        <h2>Outline Example</h2>

        <p>
            This box has a border and an outline.
        </p>
    </div>

    <input
        class="input-box"
        type="text"
        placeholder="Enter your name"
    >

</body>
</html>
