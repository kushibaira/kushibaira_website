<!DOCTYPE html>
<html>
<body>

<h2>To-Do List</h2>

<input id="task" placeholder="Enter task">

<button onclick="addTask()">
    Add
</button>

<ul id="list"></ul>

<script>

function addTask() {

    let input =
        document.getElementById("task");

    let task =
        input.value.trim();

    if (task === "") {
        return;
    }

    let li =
        document.createElement("li");

    li.textContent = task;

    li.onclick = function () {
        this.remove();
    };

    document.getElementById("list")
        .appendChild(li);

    input.value = "";
}

</script>

</body>
</html>
