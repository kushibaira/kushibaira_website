<!DOCTYPE html>
<html>
<head>
    <title>Multiple localStorage Values</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 10px 20px;
        }

        #output {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <h1>Store Multiple Values</h1>

    <button onclick="storeData()">Store Data</button>

    <div id="output"></div>

    <script>
        function storeData() {
            localStorage.setItem("name", "John");
            localStorage.setItem("age", "20");
            localStorage.setItem("city", "Chennai");

            document.getElementById("output").innerHTML =
                "Name: " + localStorage.getItem("name") + "<br>" +
                "Age: " + localStorage.getItem("age") + "<br>" +
                "City: " + localStorage.getItem("city");
        }
    </script>

</body>
</html>
