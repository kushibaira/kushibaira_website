<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
        }

        #cart {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Shopping Cart</h1>

    <button onclick="addItem('Laptop')">Add Laptop</button>
    <button onclick="addItem('Mouse')">Add Mouse</button>
    <button onclick="addItem('Keyboard')">Add Keyboard</button>

    <div id="cart"></div>

    <script>
        let cart =
            JSON.parse(localStorage.getItem("cart")) || [];

        function addItem(item) {
            cart.push(item);

            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

            displayCart();
        }

        function displayCart() {
            document.getElementById("cart").innerHTML =
                "<h3>Cart Items</h3>" +
                cart.join("<br>");
        }

        displayCart();
    </script>

</body>
</html>
